<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <clipPath id="kncPole"><rect x="25" y="15" width="14" height="34" rx="3"/></clipPath>
    <filter id="kncDarken" color-interpolation-filters="sRGB">
      <feColorMatrix type="matrix" values="0.78 0 0 0 0  0 0.78 0 0 0  0 0 0.78 0 0  0 0 0 1 0"/>
    </filter>
    <style>
      .knc-stripes { animation: knc-spin 1.6s linear infinite; }
      @keyframes knc-spin { from { transform: translateY(0); } to { transform: translateY(-7px); } }
      @media (prefers-reduced-motion: reduce) { .knc-stripes { animation: none; } }
    </style>
  </defs>
  <g filter="url(#kncDarken)">
    <rect x="22" y="10" width="20" height="5" rx="2.5" fill="currentColor" stroke="none"/>
    <rect x="22" y="49" width="20" height="5" rx="2.5" fill="currentColor" stroke="none"/>
    <rect x="25" y="15" width="14" height="34" rx="3"/>
  </g>
  <g clip-path="url(#kncPole)">
    <g class="knc-stripes" stroke-width="3.4">
      <line x1="5" y1="31" x2="59" y2="-23"/>
      <line x1="5" y1="38" x2="59" y2="-16"/>
      <line x1="5" y1="45" x2="59" y2="-9"/>
      <line x1="5" y1="52" x2="59" y2="-2"/>
      <line x1="5" y1="59" x2="59" y2="5"/>
      <line x1="5" y1="66" x2="59" y2="12"/>
      <line x1="5" y1="73" x2="59" y2="19"/>
      <line x1="5" y1="80" x2="59" y2="26"/>
      <line x1="5" y1="87" x2="59" y2="33"/>
    </g>
  </g>
</svg>
