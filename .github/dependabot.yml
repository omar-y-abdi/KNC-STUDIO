version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # Bump mcr.microsoft.com/playwright:v<version>-noble in ci.yml in the same PR.
      playwright:
        patterns:
          - playwright
          - '@playwright/test'
      cloudflare-workers:
        patterns:
          - wrangler
          - '@cloudflare/workers-types'
