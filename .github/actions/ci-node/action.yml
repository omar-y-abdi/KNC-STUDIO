name: Prepare the tested source and Node tools
description: Replay the same formatted tree and install frozen npm dependencies.
inputs:
  formatted:
    description: Download and verify the source artifact from the format job.
    default: 'true'
  cache:
    description: Cache downloads; false exercises the cold path.
    default: 'true'
runs:
  using: composite
  steps:
    - name: Verify container write access
      if: ${{ job.container.id != '' }}
      shell: bash
      run: |
        test "$(id -u)" = 1001
        export NPM_CONFIG_CACHE="$RUNNER_TEMP/npm-cache"
        echo "NPM_CONFIG_CACHE=$NPM_CONFIG_CACHE" >> "$GITHUB_ENV"
        mkdir -p "$NPM_CONFIG_CACHE" .ci-source .ci-build node_modules test-results playwright-report
        for directory in "$HOME" "$GITHUB_WORKSPACE" "$RUNNER_TEMP" "$NPM_CONFIG_CACHE" .ci-source .ci-build node_modules test-results playwright-report "${TMPDIR:-/tmp}"; do
          test -w "$directory"
          printf 'Verified uid 1001 write access: %s\n' "$directory"
        done
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: 22
        cache: ${{ inputs.cache == 'true' && 'npm' || '' }}
        package-manager-cache: ${{ inputs.cache == 'true' }}
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      if: inputs.formatted == 'true'
      with:
        name: ci-source-${{ github.run_id }}
        path: .ci-source
    - name: Apply and verify the formatted source
      if: inputs.formatted == 'true'
      shell: bash
      run: |
        git apply --allow-empty .ci-source/format.patch
        node tools/ci/build-artifact.mjs verify-source .ci-source
    - name: Install frozen dependencies
      shell: bash
      run: npm ci
