name: CMS populated startup
on:
  push:
    branches: [verify/cms-startup-20260923]
    paths: [.github/workflows/cms-assets-startup.yml]
permissions:
  contents: read
jobs:
  assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - run: bash tools/ci/setup-furl.sh
      - name: Exercise the real asset-manager initialization
        shell: python3 tools/ci/furl_ci.py {0}
        run: |
          npm ci
          npx playwright install --with-deps webkit
          cp .startup/live.mjs tools/e2e/live-startup.mjs
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/e2e/live-startup.mjs')
          t=p.read_text().replace("const browser=await webkit.launch()",'''const gallery=await fetch(upstream+'/rest/v1/gallery_images?select=id,storage_path,alt',{headers}).then(r=>r.json())
          const assets=gallery.map(row=>({id:row.id,bucket:'gallery',path:row.storage_path,name:row.storage_path,alt:row.alt,mime:'image/webp',width:null,height:null,bytes:95066,archived:false,trashed_at:null,version:0}))
          const browser=await webkit.launch()''').replace('document:doc,assets:[],fingerprint','document:doc,assets,fingerprint')
          p.write_text(t)
          PY
          node tools/e2e/live-startup.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cms-populated-startup
          path: /tmp/live-cms
          retention-days: 7
