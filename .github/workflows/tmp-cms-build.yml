name: Temporary KNC CMS verification
on:
  push:
    branches: [tmp-knc-cms-build-20260915]
    paths: ['.cms-workspace/run.json']
permissions:
  contents: read
concurrency:
  group: temporary-knc-cms
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.5
      - name: Prepare clean pinned-main candidate
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/knc-candidate" 9a17e4adce3ce3997032a5dc74fd08722fe991bd
          mkdir -p "$RUNNER_TEMP/cms-evidence"
          echo "CANDIDATE=$RUNNER_TEMP/knc-candidate" >> "$GITHUB_ENV"
          echo "EVIDENCE=$RUNNER_TEMP/cms-evidence" >> "$GITHUB_ENV"
          if test -f .cms-workspace/apply.mjs; then node .cms-workspace/apply.mjs "$RUNNER_TEMP/knc-candidate"; fi
          if test -d .cms-workspace/payload; then cp -a .cms-workspace/payload/. "$RUNNER_TEMP/knc-candidate/"; fi
          git -C "$RUNNER_TEMP/knc-candidate" status --short > "$RUNNER_TEMP/cms-evidence/changed-files.txt"
      - name: Verify candidate
        run: |
          set -euo pipefail
          bash .cms-workspace/verify.sh "$CANDIDATE" "$EVIDENCE" 2>&1 | tee "$EVIDENCE/verification.log"
      - name: Record exact patch and package touched files
        if: always()
        run: |
          set -euo pipefail
          test -d "$CANDIDATE"
          node .cms-workspace/package.mjs "$CANDIDATE" "$EVIDENCE"
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: knc-cms-verification
          path: ${{ runner.temp }}/cms-evidence/*
          retention-days: 14
      - name: Retain verified changed files
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: knc-unified-cms
          path: ${{ runner.temp }}/cms-package/**
          include-hidden-files: true
          retention-days: 14
