name: Encrypted production backup

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

concurrency:
  group: encrypted-production-backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install pinned Supabase CLI
        run: npm ci

      - name: Validate backup configuration
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_STORAGE_SECRET_KEY: ${{ secrets.SUPABASE_STORAGE_SECRET_KEY }}
          AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
        run: |
          test -n "$DATABASE_URL" || { echo 'Missing SUPABASE_DB_URL secret'; exit 1; }
          test -n "$SUPABASE_URL" || { echo 'Missing SUPABASE_URL repository variable'; exit 1; }
          test -n "$SUPABASE_STORAGE_SECRET_KEY" || { echo 'Missing SUPABASE_STORAGE_SECRET_KEY secret'; exit 1; }
          test -n "$AGE_RECIPIENT" || { echo 'Missing BACKUP_AGE_RECIPIENT variable'; exit 1; }
          case "$SUPABASE_URL" in https://*) ;; *) echo 'SUPABASE_URL must use HTTPS'; exit 1;; esac

      - name: Install backup tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes age postgresql-client

      - name: Create encrypted portable Supabase backup
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_STORAGE_SECRET_KEY: ${{ secrets.SUPABASE_STORAGE_SECRET_KEY }}
          REQUIRED_STORAGE_BUCKETS: gallery,barber-photos
          AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
        run: |
          backup_root="$RUNNER_TEMP/backup"
          plaintext="$backup_root/plaintext"
          archive="$backup_root/database-and-storage.tar.gz"
          references_before="$backup_root/storage-references-before.ndjson"
          references_after="$backup_root/storage-references-after.ndjson"
          rm -rf "$backup_root"
          mkdir -p "$plaintext"
          cleanup() {
            rm -rf "$plaintext"
            rm -f "$archive"
            rm -f "$references_before" "$references_after"
          }
          trap cleanup EXIT

          bash tools/backup/capture-storage-references.sh --output "$references_before"
          npx supabase db dump --db-url "$DATABASE_URL" --file "$plaintext/schema.sql"
          npx supabase db dump \
            --db-url "$DATABASE_URL" \
            --file "$plaintext/data.sql" \
            --use-copy \
            --data-only \
            --exclude "storage.buckets" \
            --exclude "storage.objects" \
            --exclude "storage.buckets_vectors" \
            --exclude "storage.vector_indexes"
          npx supabase db dump \
            --db-url "$DATABASE_URL" \
            --file "$plaintext/history_schema.sql" \
            --schema supabase_migrations
          npx supabase db dump \
            --db-url "$DATABASE_URL" \
            --file "$plaintext/history_data.sql" \
            --use-copy \
            --data-only \
            --schema supabase_migrations
          bash tools/backup/storage-backup.sh --output "$plaintext/storage"
          bash tools/backup/capture-storage-references.sh --output "$references_after"
          cmp --silent "$references_before" "$references_after" \
            || { echo 'Database Storage references changed during backup; retry after writes settle'; exit 1; }
          mv "$references_before" "$plaintext/storage/references.ndjson"

          (
            cd "$plaintext"
            find . -type f -not -name MANIFEST.sha256 -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 sha256sum > MANIFEST.sha256
          )
          bash tools/backup/verify-backup-tree.sh "$plaintext"
          tar --create --gzip \
            --file "$archive" \
            --directory "$plaintext" \
            .
          rm -rf "$plaintext"
          stamp="$(date -u +'%Y-%m-%dT%H-%M-%SZ')"
          encrypted="$backup_root/bladeblend-${stamp}.tar.gz.age"
          age --recipient "$AGE_RECIPIENT" \
            --output "$encrypted" \
            "$archive"
          rm -f "$archive"
          (cd "$(dirname "$encrypted")" && sha256sum "$(basename "$encrypted")" > "$(basename "$encrypted").sha256")
          test -s "$encrypted"
          echo "BACKUP_FILE=$encrypted" >> "$GITHUB_ENV"

      - name: Upload encrypted archive only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-backup-${{ github.run_id }}
          path: |
            ${{ env.BACKUP_FILE }}
            ${{ env.BACKUP_FILE }}.sha256
          if-no-files-found: error
          retention-days: 30
