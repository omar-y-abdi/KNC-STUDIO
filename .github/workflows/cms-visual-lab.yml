name: CMS visual laboratory
on:
  push:
    branches: [verify/cms-visual-20260922]
    paths: [.cms-visual-candidate.json]
permissions:
  contents: read
concurrency:
  group: cms-visual-lab-${{ github.sha }}
  cancel-in-progress: false
jobs:
  candidate:
    name: Record exact candidate tree
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.record.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Reconstruct exact local bytes on a disposable branch
        id: record
        run: |
          set -euo pipefail
          cp .cms-visual-candidate.json /tmp/candidate.json
          python - <<'PY'
          import base64, gzip, json, pathlib, re
          p = json.loads(pathlib.Path('/tmp/candidate.json').read_text())
          assert all(re.fullmatch('[0-9a-f]{40}', p[k]) for k in ('base', 'tree'))
          pathlib.Path('/tmp/candidate.patch').write_bytes(gzip.decompress(base64.b64decode(p['patch'], validate=True)))
          pathlib.Path('/tmp/candidate-base').write_text(p['base'])
          pathlib.Path('/tmp/candidate-tree').write_text(p['tree'])
          PY
          base=$(cat /tmp/candidate-base)
          expected=$(cat /tmp/candidate-tree)
          parent=$(git rev-parse --verify refs/remotes/origin/verify/cms-visual-candidate)
          if [ "$(git rev-parse "$parent^{tree}")" = "$expected" ]; then
            echo "sha=$parent" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$parent" = "$base"
          git checkout --detach "$base"
          git apply --index /tmp/candidate.patch
          tree=$(git write-tree)
          test "$tree" = "$expected"
          git config user.name 'CMS verification'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          sha=$(git commit-tree "$tree" -p "$parent" -m 'CMS workspace visual candidate: exact local tree')
          git push origin "$sha:refs/heads/verify/cms-visual-candidate"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          printf 'Candidate `%s`\n\nTree `%s`\n' "$sha" "$tree" >> "$GITHUB_STEP_SUMMARY"
  browser:
    name: Visual evidence (${{ matrix.suite }})
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [chromium, webkit, native, owner, public]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Run real CMS browser checks
        env:
          SUITE: ${{ matrix.suite }}
          BASE_URL: http://127.0.0.1:4188
        run: |
          set -o pipefail
          mkdir -p /tmp/cms-evidence
          git rev-parse HEAD > /tmp/cms-evidence/commit.txt
          git rev-parse HEAD^{tree} > /tmp/cms-evidence/tree.txt
          VITE_SUPABASE_URL=https://admin-harness.invalid VITE_SUPABASE_ANON_KEY=e2e-public-anon-key npm run dev -- --host 127.0.0.1 --port 4188 > /tmp/cms-evidence/vite.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            curl --fail --silent "$BASE_URL/tools/e2e/admin-harness.html" >/dev/null && break
            sleep 1
          done
          status=0
          case "$SUITE" in
            native) suites='native responsive scenes projection' ;;
            owner) suites='owner' ;;
            public) suites='public-regression populated conflict' ;;
            *) suites='' ;;
          esac
          if [ -n "$suites" ]; then
            for suite in $suites; do
              node tools/e2e/cms-$suite.mjs > /tmp/cms-evidence/$suite.log 2>&1 || status=1
            done
          else
            CMS_BROWSER="$SUITE" node tools/e2e/cms-workspace.mjs > /tmp/cms-evidence/workspace.log 2>&1 || status=1
          fi
          exit "$status"
      - name: Preserve exact source evidence and raw logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cms-visual-${{ matrix.suite }}-${{ github.run_number }}
          path: |
            /tmp/cms-native-*.png
            /tmp/cms-workspace-*.png
            /tmp/cms-scenes-*.png
            /tmp/cms-theme-*.png
            /tmp/cms-evidence
          retention-days: 14
  checks:
    name: Code checks
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check candidate
        run: |
          mkdir -p /tmp/cms-checks
          status=0
          for command in format:check lint typecheck test build; do
            npm run "$command" > "/tmp/cms-checks/${command//:/-}.log" 2>&1 || status=1
          done
          exit "$status"
      - name: Preserve check results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cms-checks-${{ github.run_number }}
          path: /tmp/cms-checks
          retention-days: 14
