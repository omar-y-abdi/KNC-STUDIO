name: CMS final visual review contracts
on:
  push:
    branches: [verify/cms-final-20260922]
    paths: [.github/workflows/cms-email-semantics.yml]
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install only the new tests against unchanged product source
        run: |
          mkdir -p /tmp/cms-review-red
          cp .cms-completion/final-review-tests.patch /tmp/cms-review-red/
          git checkout --detach 9fba1c49316a6a12eff3821f55aa32b8fc29cae4
          git apply /tmp/cms-review-red/final-review-tests.patch
          git rev-parse HEAD > /tmp/cms-review-red/source-commit.txt
          npm ci > /tmp/cms-review-red/install.log 2>&1
          npx playwright install --with-deps chromium > /tmp/cms-review-red/browser.log 2>&1
          bash tools/ci/setup-furl.sh
      - name: Exercise visible drawer aperture and email group semantics
        env:
          CMS_ENGINE: chromium
          CMS_WIDTH: 1440
          CMS_EVIDENCE_DIR: /tmp/cms-review-red
          BASE_URL: http://127.0.0.1:4188
        run: |
          VITE_SUPABASE_URL=https://admin-harness.invalid VITE_SUPABASE_ANON_KEY=e2e-public-anon-key npm run dev -- --host 127.0.0.1 --port 4188 > /tmp/cms-review-red/server.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS "$BASE_URL/tools/e2e/admin-harness.html" > /dev/null && break; sleep 1; done
          set +e
          status=0
          for suite in cms-workspace-edge cms-workspace-views; do
            node "tools/e2e/$suite.mjs" > "/tmp/cms-review-red/$suite.log" 2>&1
            result=$?
            echo "$result" > "/tmp/cms-review-red/$suite.exit-code"
            test "$result" = 0 || status=1
            furl compress "/tmp/cms-review-red/$suite.log" --json > "/tmp/cms-review-red/$suite.furl.json"
          done
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cms-final-review-red
          path: /tmp/cms-review-red
          retention-days: 14
