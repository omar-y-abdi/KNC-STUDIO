name: CMS post-drag card verification
on:
  push:
    branches: [verify/cms-runtime-20260924]
    paths: [.github/workflows/cms-marquee-settle.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: bb2783bb63322c2ea69fc048df5a5298bac3b605
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - name: Correct the observed empty-space pointer target
        run: |
          mkdir -p /tmp/card-source
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/e2e/cms-barber-marquee.mjs')
          s=p.read_text()
          start=s.index('  const box = await track.boundingBox()',s.index('async function dragLeft'))
          end=s.index('  const before = await transformX(track)',start)
          s=s[:start]+'''  const viewport = page.viewportSize()
            assert.ok(viewport, 'Barber track has no visible viewport')
            // A looping track has gaps. Fixed screen coordinates repeatedly hit
            // empty space in WebKit, so those recorded "drags" never reached Embla.
            const { x, y, hit } = await track.evaluate((node) => {
              const candidates = [...node.querySelectorAll(':scope > [role="button"]')]
                .map((card) => {
                  const rect = card.getBoundingClientRect()
                  const left = Math.max(0, rect.left)
                  const right = Math.min(globalThis.innerWidth, rect.right)
                  const top = Math.max(20, rect.top)
                  const bottom = Math.min(globalThis.innerHeight - 20, rect.bottom)
                  return { card, left, right, top, bottom, width: right - left }
                })
                .filter(({ width, top, bottom }) => width > 60 && bottom - top > 40)
                .sort((a, b) => b.width - a.width)
              const target = candidates[0]
              if (!target) throw new Error('No visible barber card can receive a drag')
              const x = target.right - 20
              const y = target.top + Math.min(80, (target.bottom - target.top) / 2)
              if (!target.card.contains(globalThis.document.elementFromPoint(x, y)))
                throw new Error('Visible barber drag target is covered')
              return { x, y, hit: target.card.textContent?.trim().slice(0, 30) ?? '' }
            })
          '''+s[end:]
          old="await page.mouse.move(viewport.width * (0.82 - distance), y, { steps: 8 })"
          assert s.count(old)==1
          s=s.replace(old,"await page.mouse.move(Math.max(10, x - viewport.width * distance), y, { steps: 8 })")
          p.write_text(s)
          PY
          bash tools/ci/setup-furl.sh
          npm ci --no-audit --no-fund > /tmp/card-source/install.log 2>&1
          npx prettier --write tools/e2e/cms-barber-marquee.mjs > /tmp/card-source/format.log 2>&1
          npx eslint tools/e2e/cms-barber-marquee.mjs
          git add tools/e2e/cms-barber-marquee.mjs
          git diff --cached --check
          git diff --cached > /tmp/card-source/test.patch
          git -c user.name='CMS runtime fixes' -c user.email='cms-runtime@users.noreply.github.com' commit -m 'test: hit-test visible cards before carousel drag gestures'
          git rev-parse HEAD > /tmp/card-source/commit.txt
          git rev-parse HEAD^{tree} > /tmp/card-source/tree.txt
          git bundle create /tmp/card-source/source.bundle HEAD
          code=0
          git push origin HEAD:refs/heads/verify/cms-card-settle-20260924 > /tmp/card-source/push.log 2>&1 || code=$?
          echo "$code" > /tmp/card-source/push.exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cms-card-source-${{ github.run_number }}
          path: /tmp/card-source
          retention-days: 7
  verify:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    env:
      CMS_ENGINE: ${{ matrix.engine }}
      BASE_URL: http://127.0.0.1:4188
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cms-card-source-${{ github.run_number }}
          path: /tmp/card-source
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - name: Load the exact source and prepare tools
        run: |
          git fetch /tmp/card-source/source.bundle HEAD
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$(cat /tmp/card-source/commit.txt)"
          mkdir -p /tmp/card-results
          cp /tmp/card-source/commit.txt /tmp/card-source/tree.txt /tmp/card-results/
          bash tools/ci/setup-furl.sh
          npm ci --no-audit --no-fund > /tmp/card-results/install.log 2>&1
      - name: Repeat the unchanged owner interaction assertions
        shell: python3 tools/ci/furl_ci.py {0}
        run: |
          npx playwright install --with-deps "$CMS_ENGINE"
          VITE_SUPABASE_URL=https://admin-harness.invalid VITE_SUPABASE_ANON_KEY=e2e-public-anon-key npm run dev -- --host 127.0.0.1 --port 4188 > /tmp/card-results/server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do curl -fsS "$BASE_URL/tools/e2e/admin-harness.html" >/dev/null && break; sleep 1; done
          curl -fsS "$BASE_URL/tools/e2e/admin-harness.html" >/dev/null
          status=0
          for repeat in 1 2 3; do
            mkdir -p "/tmp/card-results/$repeat"
            code=0
            CMS_EVIDENCE_DIR="/tmp/card-results/$repeat" node tools/e2e/cms-barber-marquee.mjs > "/tmp/card-results/$repeat/test.log" 2>&1 || code=$?
            echo "$code" > "/tmp/card-results/$repeat/exit-code.txt"
            test "$code" = 0 || status=1
          done
          exit "$status"
      - name: Compress diagnostics
        if: always()
        run: |
          find /tmp/card-results -name '*.log' -exec sh -c 'furl compress "$1" --json > "$1.furl.json" || true' _ '{}' \;
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cms-card-${{ matrix.engine }}-${{ github.run_number }}
          path: /tmp/card-results
          retention-days: 7
