name: CMS layout proof
on:
  push:
    branches: [verify/cms-layout-proof-20260922]
permissions:
  contents: read
jobs:
  geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: bash tools/ci/setup-furl.sh
      - name: Capture and measure the incumbent layout
        run: |
          mkdir -p /tmp/cms-layout
          VITE_SUPABASE_URL=https://admin-harness.invalid VITE_SUPABASE_ANON_KEY=e2e-public-anon-key npm run dev -- --host 127.0.0.1 --port 4188 > /tmp/cms-layout/server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4188/tools/e2e/admin-harness.html >/dev/null && break; sleep 1; done
          node tools/e2e/cms-layout-proof.mjs > /tmp/cms-layout/layout.log 2>&1
      - name: Compact output
        if: always()
        run: furl compress /tmp/cms-layout/layout.log --json > /tmp/cms-layout/layout.furl.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cms-layout-proof
          path: /tmp/cms-layout
          retention-days: 7
