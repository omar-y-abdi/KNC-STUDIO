name: Temporary CMS failure diagnostics
on:
  push:
    branches: [tmp-knc-cms-terminal-20260915]
    paths: [.github/workflows/tmp-cms-diagnostics.yml]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cms-final-chromium-evidence
          run-id: 34984956055
          repository: omar-y-abdi/KNC-STUDIO
          github-token: ${{ github.token }}
          path: evidence
      - name: Inspect captured preview frame snapshot
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import json
          p=next(Path('evidence').rglob('owner-studio-native-preview.zip'))
          with ZipFile(p) as z:
            text=z.read('trace.trace').decode(errors='replace')
            count=0
            for line in text.splitlines():
              try: row=json.loads(line)
              except ValueError: continue
              if row.get('type')!='frame-snapshot': continue
              snap=row.get('snapshot',{})
              url=snap.get('frameUrl','')
              if '/admin/cms/preview' not in url: continue
              count+=1
              print('\nPREVIEW SNAPSHOT',count,'URL',url,'MAIN',snap.get('isMainFrame'))
              html=json.dumps(snap.get('html'),ensure_ascii=False)
              print(html[:12000])
              print('RESOURCE_OVERRIDES',json.dumps(snap.get('resourceOverrides'),ensure_ascii=False)[:3000])
            print('TOTAL',count)
          PY
