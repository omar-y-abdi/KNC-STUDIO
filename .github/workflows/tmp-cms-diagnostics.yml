name: Temporary CMS failure diagnostics
on:
  push:
    branches: [tmp-knc-cms-terminal-20260915]
    paths: [.github/workflows/tmp-cms-diagnostics.yml]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cms-final-firefox-evidence
          run-id: 34982036763
          repository: omar-y-abdi/KNC-STUDIO
          github-token: ${{ github.token }}
          path: evidence
      - name: Inspect captured authentication boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from urllib.parse import urlsplit
          import json,re
          def clean(s):
            s=re.sub(r'eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+','[redacted]',s)
            return re.sub(r'(Bearer\s+)[\w.-]+',r'\1[redacted]',s)
          print('ARTIFACT PATHS', [str(p) for p in Path('evidence').rglob('*') if p.is_file()])
          for p in sorted(Path('evidence').rglob('*.zip')):
            if 'owner-studio' not in p.name:continue
            print('TRACE',p)
            with ZipFile(p) as z:
              for name in z.namelist():
                if not name.endswith(('.network','.trace')):continue
                for line in z.read(name).decode().splitlines():
                  try: row=json.loads(line)
                  except ValueError:continue
                  if row.get('type')=='console':
                    print('CONSOLE',clean(json.dumps(row))[:2200])
                  item=row.get('snapshot',{})
                  if 'request' in item:
                    url=item['request'].get('url',''); parsed=urlsplit(url)
                    if any(key in url for key in ['54321','/admin','/login']):
                      result={'url':parsed.scheme+'://'+parsed.netloc+parsed.path,'method':item['request'].get('method'),'status':item.get('response',{}).get('status'),'failure':item.get('_failureText')}
                      result['csp']=[h['value'] for h in item.get('response',{}).get('headers',[]) if h['name'].lower()=='content-security-policy']
                      print('NETWORK',clean(json.dumps(result)))
          PY
