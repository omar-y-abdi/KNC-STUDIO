name: Temporary CMS failure diagnostics
on:
  push:
    branches: [tmp-knc-cms-terminal-20260915]
    paths: [.github/workflows/tmp-cms-diagnostics.yml]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cms-final-chromium-evidence
          run-id: 34984956055
          repository: omar-y-abdi/KNC-STUDIO
          github-token: ${{ github.token }}
          path: evidence
      - name: Inspect native preview frame state
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import re
          needles=['Väntar på redigeringsdokumentet','Laddar adminpanelen','Kunde inte nå servern','Endast ägaren','data-cms-node','cms-preview','cms-studio']
          p=next(Path('evidence').rglob('owner-studio-native-preview.zip'))
          print('TRACE',p)
          with ZipFile(p) as z:
            for name in z.namelist():
              data=z.read(name)
              try: text=data.decode('utf-8')
              except UnicodeDecodeError: continue
              hits=[needle for needle in needles if needle in text]
              if not hits: continue
              print('\nRESOURCE',name,'HITS',hits)
              for needle in hits:
                for match in list(re.finditer(re.escape(needle),text))[:5]:
                  start=max(0,match.start()-350); end=min(len(text),match.end()+650)
                  print('---',needle,'---')
                  print(text[start:end].replace('\n',' ')[:1600])
          PY
