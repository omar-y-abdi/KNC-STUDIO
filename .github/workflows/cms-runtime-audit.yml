name: CMS runtime boundary audit
on:
  push:
    branches: [verify/cms-runtime-20260924]
    paths: [.github/workflows/cms-runtime-audit.yml, tools/e2e/cms-runtime-probe.mjs]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - name: Prepare tools
        run: |
          mkdir -p /tmp/cms-runtime
          bash tools/ci/setup-furl.sh
      - name: Trace actual boundary behavior without production writes
        shell: python3 tools/ci/furl_ci.py {0}
        run: |
          npm ci
          npx playwright install --with-deps chromium
          VITE_SUPABASE_URL=https://admin-harness.invalid VITE_SUPABASE_ANON_KEY=e2e-public-anon-key npm run dev -- --host 127.0.0.1 --port 4188 > /tmp/cms-runtime/server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4188/tools/e2e/admin-harness.html >/dev/null && break; sleep 1; done
          node tools/e2e/cms-runtime-probe.mjs > /tmp/cms-runtime/probe.log 2>&1
      - name: Compress diagnostics
        if: always()
        run: |
          for log in /tmp/cms-runtime/*.log; do test -f "$log" && furl compress "$log" --json > "$log.furl.json" || true; done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cms-runtime-probe-${{ github.run_number }}
          path: /tmp/cms-runtime
          retention-days: 7
