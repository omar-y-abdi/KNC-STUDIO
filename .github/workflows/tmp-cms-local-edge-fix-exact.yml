name: Temporary CMS exact local edge fix artifact
on:
  push:
    branches: [tmp-knc-cms-terminal-20260915]
    paths:
      - .github/workflows/tmp-cms-local-edge-fix-exact.yml
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Build exact fix from verified candidate pipeline
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/candidate"
          FIX="$RUNNER_TEMP/fix"
          git worktree add --detach "$ROOT" 9a17e4adce3ce3997032a5dc74fd08722fe991bd
          node .cms-workspace/apply.mjs "$ROOT"
          cp -a .cms-workspace/payload/. "$ROOT/"
          cd "$ROOT"
          npm ci
          node "$GITHUB_WORKSPACE/.cms-workspace/run-integration.mjs" "$ROOT"
          node "$GITHUB_WORKSPACE/.cms-workspace/terminal-refinements.mjs" "$ROOT"
          grep -F 'policy = "oneshot"' supabase/config.toml
          ! grep -F 'policy = "per_worker"' supabase/config.toml
          mkdir -p "$FIX/supabase/functions/cms-studio"
          cp supabase/config.toml "$FIX/supabase/config.toml"
          cp supabase/functions/cms-studio/index.ts "$FIX/supabase/functions/cms-studio/index.ts"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: KNC-CMS-local-edge-fix-EXACT-20260916
          path: ${{ runner.temp }}/fix
          retention-days: 7
