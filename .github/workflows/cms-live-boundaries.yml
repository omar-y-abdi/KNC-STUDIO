name: CMS live read-only boundaries
on:
  push:
    branches: [verify/cms-runtime-20260924]
    paths: [.github/workflows/cms-live-boundaries.yml]
permissions:
  contents: read
jobs:
  boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 13cb50c10a2f61465a33befb115b545a47e02014
          persist-credentials: false
      - name: Check deployment identity and denied unauthorized access
        run: |
          mkdir -p /tmp/cms-live
          python3 - <<'PY'
          import json, pathlib, re, urllib.request, urllib.error
          root=pathlib.Path('/tmp/cms-live')
          expected=re.search(r'[a-f0-9]{64}',pathlib.Path('shared/cms-release.ts').read_text()).group(0)
          endpoint='https://soktgawvexeumqvtyhda.supabase.co/functions/v1/cms-studio'
          checks=[]
          def record(value):
            checks.append(value)
            (root/'boundary-results.json').write_text(json.dumps(checks,indent=2))
            print(json.dumps(value))
          for label,method,origin,wanted in [
            ('approved-origin-release','OPTIONS','https://bladeblendstudio.se',204),
            ('unapproved-origin','OPTIONS','https://unapproved.invalid',403),
            ('unauthorized-state','POST','https://bladeblendstudio.se',401),
          ]:
            request=urllib.request.Request(endpoint,method=method,headers={'Origin':origin,'Content-Type':'application/json'},data=b'{"action":"state"}' if method=='POST' else None)
            try:
              response=urllib.request.urlopen(request,timeout=15)
            except urllib.error.HTTPError as error:
              response=error
            with response:
              status=response.status
              stamp=response.headers.get('x-cms-release')
              response.read()
            record({'name':label,'status':status,'expectedStatus':wanted,'passed':status==wanted and (label!='approved-origin-release' or stamp==expected),**({'release':stamp,'expectedRelease':expected} if label=='approved-origin-release' else {})})
          try:
            response=urllib.request.urlopen('https://bladeblendstudio.se/api/cms/presentation',timeout=15)
          except urllib.error.HTTPError as error:
            response=error
          with response:
            raw=response.read(4*1024*1024+1)
            result={'name':'public-presentation','status':response.status,'bytes':len(raw),'passed':False,'contentType':response.headers.get('Content-Type'),'cfMitigated':response.headers.get('cf-mitigated')}
            if response.status==200:
              public=json.loads(raw)
              presentation=public.get('presentation',{})
              result.update({'revision':public.get('revision'),'pages':len(presentation.get('pages',[])),'passed':bool(presentation.get('pages'))})
            else:
              result['diagnostic']='Read denied; no credential substitution or access-control bypass attempted.'
            record(result)
          assert all(check['passed'] for check in checks), 'A live read-only boundary differed from the repository contract'
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cms-live-boundaries-${{ github.run_number }}
          path: /tmp/cms-live
          retention-days: 7
