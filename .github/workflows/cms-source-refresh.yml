name: CMS candidate source refresh
on:
  push:
    branches: [verify/cms-visual-refinement-20260922]
    paths: [.github/workflows/cms-source-refresh.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: a60e2e4fb6fc44ef1b464a9168a16500c4272ebd
          fetch-depth: 0
          persist-credentials: false
      - name: Export exact tested source and parent identity
        run: |
          set -euo pipefail
          mkdir -p /tmp/cms-source
          test "$(git rev-parse HEAD^{tree})" = 768e2d0cfdcc8f040122d6d4d18f8d16d9c2ae2a
          git bundle create /tmp/cms-source/source.bundle HEAD
          git bundle verify /tmp/cms-source/source.bundle
          git diff --binary c47fff39948823dd9651d2d72e002f3daa7cd2e2 HEAD > /tmp/cms-source/candidate.patch
          git rev-parse HEAD > /tmp/cms-source/commit.txt
          git rev-parse HEAD^{tree} > /tmp/cms-source/tree.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cms-source-reconciliation
          path: /tmp/cms-source
          retention-days: 2
