name: CMS mobile geometry proof
on:
  push:
    branches: [verify/cms-runtime-20260924]
    paths: [.github/workflows/cms-mobile-proof.yml, .runtime/cms-mobile.mjs]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    env:
      CMS_ENGINE: ${{ matrix.engine }}
      CMS_EVIDENCE_DIR: /tmp/mobile-proof
      BASE_URL: http://127.0.0.1:4188
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - name: Pin untouched product and install browser
        run: |
          cp .runtime/cms-mobile.mjs /tmp/cms-mobile.mjs
          git checkout --detach 6201b97313f28982418c114a6ad78bc0afdc35c4
          cp /tmp/cms-mobile.mjs tools/e2e/cms-mobile.mjs
          mkdir -p "$CMS_EVIDENCE_DIR"
          git rev-parse HEAD > "$CMS_EVIDENCE_DIR/source-commit.txt"
          bash tools/ci/setup-furl.sh
          npm ci --no-audit --no-fund > "$CMS_EVIDENCE_DIR/install.log" 2>&1
      - name: Reproduce the reported geometry
        shell: python3 tools/ci/furl_ci.py {0}
        run: |
          npx playwright install --with-deps "$CMS_ENGINE"
          VITE_SUPABASE_URL=https://admin-harness.invalid VITE_SUPABASE_ANON_KEY=e2e-public-anon-key npm run dev -- --host 127.0.0.1 --port 4188 > "$CMS_EVIDENCE_DIR/server.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do curl -fsS "$BASE_URL/tools/e2e/admin-harness.html" >/dev/null && break; sleep 1; done
          node tools/e2e/cms-mobile.mjs > "$CMS_EVIDENCE_DIR/mobile.log" 2>&1
      - name: Compact diagnostics
        if: always()
        run: |
          for log in "$CMS_EVIDENCE_DIR"/*.log; do furl compress "$log" --json > "$log.furl.json" || true; done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cms-mobile-red-${{ matrix.engine }}-${{ github.run_number }}
          path: /tmp/mobile-proof
          retention-days: 7
