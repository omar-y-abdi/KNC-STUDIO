name: CMS engineering hardening
on:
  push:
    branches: [verify/cms-hardening-20260923]
    paths: [.github/workflows/cms-hardening.yml]
permissions:
  contents: read
concurrency:
  group: cms-engineering-hardening-final
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      source: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - name: Build exact senior-review candidate
        id: source
        run: |
          set -euo pipefail
          mkdir -p /tmp/hardening-source
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib
          encoded = pathlib.Path('.hardening/senior.patch.gz.b64').read_text().strip()
          assert hashlib.sha256(encoded.encode()).hexdigest() == 'a28026246ec714124817ce5cfbc838340c9f9cb7da63bedc7b39c047b08dd42e'
          pathlib.Path('/tmp/senior.patch').write_bytes(gzip.decompress(base64.b64decode(encoded, validate=True)))
          assert hashlib.sha256(pathlib.Path('/tmp/senior.patch').read_bytes()).hexdigest() == '1c0fe7f6cb968ab91c43309e2b3afa987d9adc855035652e598e38b18a2f8644'
          PY
          git checkout --detach 2b472121a3a2a60864714edbcbb2f8367896cd10
          git apply --check /tmp/senior.patch
          git apply --index /tmp/senior.patch
          npm ci --no-audit --no-fund > /tmp/hardening-source/install.log 2>&1
          git diff --cached --name-only -z | xargs -0 npx prettier --write > /tmp/hardening-source/format.log 2>&1
          git add -A
          node tools/release/cms-release.mjs stamp
          git add shared/cms-release.ts
          git diff --cached --check
          git -c user.name='CMS engineering review' -c user.email='cms-review@users.noreply.github.com' commit -m 'fix: make resource replacement and bulk deletion failure-safe'
          git rev-parse HEAD > /tmp/hardening-source/source-commit.txt
          git rev-parse HEAD^{tree} > /tmp/hardening-source/source-tree.txt
          git bundle create /tmp/hardening-source/source.bundle HEAD
          git bundle verify /tmp/hardening-source/source.bundle
          git push origin HEAD:refs/heads/verify/cms-hardening-final-product-20260923
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cms-hardening-final-source
          path: /tmp/hardening-source
          retention-days: 7
  verify:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        suite: [core, chromium, webkit]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.prepare.outputs.source }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - name: Prepare verification
        run: |
          mkdir -p /tmp/hardening-evidence
          git rev-parse HEAD > /tmp/hardening-evidence/source-commit.txt
          git rev-parse HEAD^{tree} > /tmp/hardening-evidence/source-tree.txt
          bash tools/ci/setup-furl.sh
          npm ci --no-audit --no-fund > /tmp/hardening-evidence/install.log 2>&1
      - name: Core gates
        if: matrix.suite == 'core'
        shell: python3 tools/ci/furl_ci.py {0}
        run: |
          node tools/release/cms-release.mjs check
          npm run typecheck
          npm run lint
          npm run format:check
          npm test
          npm run build
      - name: Browser gates
        if: matrix.suite != 'core'
        env:
          CMS_ENGINE: ${{ matrix.suite }}
          BASE_URL: http://127.0.0.1:4188
        shell: python3 tools/ci/furl_ci.py {0}
        run: |
          set -euo pipefail
          npx playwright install --with-deps "$CMS_ENGINE"
          VITE_SUPABASE_URL=https://admin-harness.invalid VITE_SUPABASE_ANON_KEY=e2e-public-anon-key npm run dev -- --host 127.0.0.1 --port 4188 > /tmp/hardening-evidence/server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do curl -fsS "$BASE_URL/tools/e2e/admin-harness.html" >/dev/null && break; sleep 1; done
          curl -fsS "$BASE_URL/tools/e2e/admin-harness.html" >/dev/null
          status=0
          suites="cms-engineering cms-adversarial"
          if [ "$CMS_ENGINE" = "chromium" ]; then
            suites="$suites cms-scenes cms-owner cms-responsive"
          fi
          for suite in $suites; do
            CMS_EVIDENCE_DIR="/tmp/hardening-evidence/$suite" node "tools/e2e/$suite.mjs" > "/tmp/hardening-evidence/$suite.log" 2>&1 || status=1
          done
          for log in /tmp/hardening-evidence/*.log; do
            test -f "$log" || continue
            furl compress "$log" --json > "$log.furl.json" || true
          done
          exit "$status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cms-hardening-final-${{ matrix.suite }}
          path: /tmp/hardening-evidence
          retention-days: 7
