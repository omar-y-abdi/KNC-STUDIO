name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Compact successful verbose output; keep complete diagnostics on failure.
defaults:
  run:
    shell: python3 tools/ci/furl_ci.py {0}

jobs:
  format:
    name: Auto-format and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Furl log reduction
        shell: bash
        run: bash tools/ci/setup-furl.sh
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Auto-format supported files
        run: bash tools/ci/format.sh
      - run: npm run lint
      - name: Verify formatting and error handling
        run: node --test tools/ci/test-format.mjs
      - name: Share formatted changes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          # Keep the name stable for re-runs of failed downstream jobs.
          name: ci-format-${{ github.run_id }}
          path: ${{ runner.temp }}/format.patch
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  frontend:
    needs: format
    name: Frontend and browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Download formatted changes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ci-format-${{ github.run_id }}
          path: ${{ runner.temp }}/ci-format
      - name: Apply formatting from first job
        shell: bash
        run: git apply --allow-empty "$RUNNER_TEMP/ci-format/format.patch"
      - name: Set up Furl log reduction
        shell: bash
        run: bash tools/ci/setup-furl.sh
      - name: Verify Furl log reduction and shell safety
        shell: bash
        run: python3 -m unittest discover -s tools/ci -p 'test_furl_ci.py' -v
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check CMS backend release stamp
        run: node tools/release/cms-release.mjs check
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run deploy:dry-run
      - name: Reject unlicensed legacy font artifacts
        run: |
          test -z "$(find public -type f \( -name 'SF-Pro*' -o -name '*San-Francisco*' \) -print)"
          ! grep -aERn 'Apple Inc\.|SF Pro|SF-Pro' dist
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Browser smoke
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/blade-preview.log 2>&1 &
          preview_pid=$!
          VITE_SUPABASE_URL=https://admin-harness.invalid VITE_SUPABASE_ANON_KEY=e2e-public-anon-key npm run dev -- --host 127.0.0.1 --port 4188 > /tmp/blade-admin-harness.log 2>&1 &
          admin_harness_pid=$!
          trap 'kill "$preview_pid" "$admin_harness_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4188/ >/dev/null && break
            sleep 1
          done
          BASE_URL=http://127.0.0.1:4173 npm run test:e2e
          BASE_URL=http://127.0.0.1:4188 npm run test:e2e:admin
          BASE=http://127.0.0.1:4173 OUT=/tmp/visual-candidate node tools/visual/capture.mjs
          BASELINE=tools/visual/baseline-linux CANDIDATE=/tmp/visual-candidate DIFF=/tmp/visual-diff node tools/visual/compare.mjs
      - name: Preserve failed visual comparisons
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-failure-${{ github.run_attempt }}
          path: |
            /tmp/visual-candidate/*.png
            /tmp/visual-diff/*.png
          retention-days: 7

  cms-workspace:
    needs: format
    name: CMS workspace (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      BASE_URL: http://127.0.0.1:4188
      CMS_BROWSER: ${{ matrix.browser }}
      CMS_EVIDENCE_DIR: /tmp/cms-workspace
      AXE_PATH: /tmp/cms-a11y/node_modules/axe-core/axe.min.js
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Download formatted changes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ci-format-${{ github.run_id }}
          path: ${{ runner.temp }}/ci-format
      - name: Apply formatting from first job
        shell: bash
        run: git apply --allow-empty "$RUNNER_TEMP/ci-format/format.patch"
      - name: Set up Furl log reduction
        shell: bash
        run: bash tools/ci/setup-furl.sh
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install isolated inspection tools
        run: |
          npx playwright install --with-deps "$CMS_BROWSER"
          npm install --prefix /tmp/cms-a11y --ignore-scripts --no-audit --no-fund axe-core@4.11.1
      - name: Exercise workspace, preview, accessibility and touch contracts
        run: |
          mkdir -p "$CMS_EVIDENCE_DIR"
          git rev-parse HEAD > "$CMS_EVIDENCE_DIR/source-commit.txt"
          cp "$RUNNER_TEMP/ci-format/format.patch" "$CMS_EVIDENCE_DIR/source-format.patch"
          VITE_SUPABASE_URL=https://admin-harness.invalid VITE_SUPABASE_ANON_KEY=e2e-public-anon-key npm run dev -- --host 127.0.0.1 --port 4188 > "$CMS_EVIDENCE_DIR/server.log" 2>&1 &
          dev_pid=$!
          trap 'kill "$dev_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            curl --fail --silent "$BASE_URL/tools/e2e/admin-harness.html" >/dev/null && break
            sleep 1
          done
          status=0
          for suite in cms-workspace cms-preview-state cms-workspace-views cms-touch; do
            result=0
            node "tools/e2e/$suite.mjs" > "$CMS_EVIDENCE_DIR/$suite.log" 2>&1 || result=$?
            printf '%s\n' "$result" > "$CMS_EVIDENCE_DIR/$suite.exit-code"
            furl compress "$CMS_EVIDENCE_DIR/$suite.log" --json > "$CMS_EVIDENCE_DIR/$suite.furl.json"
            if [ "$result" -ne 0 ]; then cat "$CMS_EVIDENCE_DIR/$suite.log"; status=1; fi
          done
          exit "$status"
      - name: Preserve complete workspace evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cms-workspace-${{ matrix.browser }}-${{ github.run_attempt }}
          path: /tmp/cms-workspace
          retention-days: 7

  cms-shell:
    needs: format
    name: CMS shell browsers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Download formatted changes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ci-format-${{ github.run_id }}
          path: ${{ runner.temp }}/ci-format
      - name: Apply formatting from first job
        shell: bash
        run: git apply --allow-empty "$RUNNER_TEMP/ci-format/format.patch"
      - name: Set up Furl log reduction
        shell: bash
        run: bash tools/ci/setup-furl.sh
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Real desktop and mobile CMS shell
        run: |
          VITE_SUPABASE_URL=https://admin-harness.invalid VITE_SUPABASE_ANON_KEY=e2e-public-anon-key npm run dev -- --host 127.0.0.1 --port 4188 > /tmp/blade-cms-shell.log 2>&1 &
          dev_pid=$!
          trap 'kill "$dev_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4188/tools/e2e/admin-harness.html >/dev/null && break
            sleep 1
          done
          BASE_URL=http://127.0.0.1:4188 ADMIN_E2E_SCENARIO=cms-shell npm run test:e2e:admin
          BASE_URL=http://127.0.0.1:4188 node tools/e2e/cms-native.mjs
          status=0
          BASE_URL=http://127.0.0.1:4188 node tools/e2e/cms-projection.mjs || status=1
          BASE_URL=http://127.0.0.1:4188 node tools/e2e/cms-owner.mjs || status=1
          BASE_URL=http://127.0.0.1:4188 node tools/e2e/cms-responsive.mjs || status=1
          BASE_URL=http://127.0.0.1:4188 node tools/e2e/cms-scenes.mjs || status=1
          BASE_URL=http://127.0.0.1:4188 node tools/e2e/cms-public-regression.mjs || status=1
          BASE_URL=http://127.0.0.1:4188 node tools/e2e/cms-populated.mjs || status=1
          BASE_URL=http://127.0.0.1:4188 node tools/e2e/cms-conflict.mjs || status=1
          exit "$status"
      - name: Preserve CMS browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cms-browser-${{ github.run_attempt }}
          path: |
            /tmp/cms-native-*.png
            /tmp/blade-cms-shell.log
          retention-days: 7

  edge-functions:
    needs: format
    name: Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Download formatted changes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ci-format-${{ github.run_id }}
          path: ${{ runner.temp }}/ci-format
      - name: Apply formatting from first job
        shell: bash
        run: git apply --allow-empty "$RUNNER_TEMP/ci-format/format.patch"
      - name: Set up Furl log reduction
        shell: bash
        run: bash tools/ci/setup-furl.sh
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.9.5
      - run: npm ci
      - name: Type-check every Edge Function entrypoint
        run: |
          while IFS= read -r file; do
            deno check --frozen --node-modules-dir=manual "$file"
          done < <(find supabase/functions -mindepth 2 -maxdepth 2 -name index.ts -print | sort)

  database:
    needs: format
    name: Database and integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Download formatted changes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ci-format-${{ github.run_id }}
          path: ${{ runner.temp }}/ci-format
      - name: Apply formatting from first job
        shell: bash
        run: git apply --allow-empty "$RUNNER_TEMP/ci-format/format.patch"
      - name: Set up Furl log reduction
        shell: bash
        run: bash tools/ci/setup-furl.sh
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Configure local Edge Function test secrets
        run: |
          cat > supabase/functions/.env <<'EOF'
          TURNSTILE_SECRET=1x0000000000000000000000000000000AA
          IP_SALT=ci-booking-ip-salt-not-for-production
          PUBLIC_ACTION_HASH_SALT=ci-public-action-hash-salt-not-for-production
          CUSTOMER_GATEWAY_SECRET=ci-customer-gateway-secret-not-for-production
          PUBLIC_SITE_ORIGINS=http://127.0.0.1:4173,https://127.0.0.1:4197
          CMS_ALLOWED_ORIGINS=https://127.0.0.1:4197
          PUBLIC_SUPABASE_URL=http://127.0.0.1:54321
          EOF
      - name: Start local Supabase
        run: npx supabase start
      - name: Public booking rollout compatibility
        run: bash tools/release/test-public-booking-stages.sh
      - name: Restore current schema after historical rollout checks
        run: npx supabase db reset --local
      - name: pgTAP
        run: npx supabase test db --local
      - name: Adapter integration tests
        run: npm run test:integration
      - name: Install customer browser engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Customer browser through local Worker and Edge
        run: npm run test:e2e -- --customer
      - name: Preserve customer and published CMS screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: customer-browser-${{ github.run_attempt }}
          path: /tmp/knc-customer-e2e-*/*.png
          retention-days: 7
      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup
