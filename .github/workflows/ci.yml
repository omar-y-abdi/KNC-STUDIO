name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      cold-cache:
        description: Run every gate without dependency or browser caches.
        type: boolean
        default: false
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  CI_CACHE: ${{ !inputs.cold-cache }}
defaults:
  run:
    shell: python3 tools/ci/furl_ci.py {0}
jobs:
  format:
    name: Auto-format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-node
        with:
          formatted: 'false'
          cache: ${{ env.CI_CACHE }}
      - name: Format and verify supported files
        run: bash tools/ci/format.sh
      - name: Record the exact tested source
        run: node tools/ci/build-artifact.mjs source "$RUNNER_TEMP"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          # Stable per-run names let failed consumers be re-run independently.
          name: ci-source-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/format.patch
            ${{ runner.temp }}/source.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7
  quality:
    needs: format
    name: Static checks and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-node
        with:
          cache: ${{ env.CI_CACHE }}
      - name: Verify CI orchestration and failure paths
        run: |
          node --test tools/ci/test-*.mjs
          python3 -m unittest discover -s tools/ci -p 'test_furl_ci.py' -v
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - name: Check CMS backend release stamp
        run: node tools/release/cms-release.mjs check
  build:
    needs: format
    name: Production builds and Worker packaging
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-node
        with:
          cache: ${{ env.CI_CACHE }}
      - run: npm run build
      - name: Package actual Worker without rebuilding assets
        run: npx wrangler deploy --dry-run
      - name: Reject unlicensed legacy font artifacts
        run: |
          test -z "$(find public -type f \( -name 'SF-Pro*' -o -name '*San-Francisco*' \) -print)"
          ! grep -aERn 'Apple Inc\.|SF Pro|SF-Pro' dist
      - name: Preserve public build and build the CSP fixture once
        run: |
          mkdir -p "$RUNNER_TEMP/ci-build"
          cp -a dist "$RUNNER_TEMP/ci-build/public"
          VITE_SUPABASE_URL=https://admin-harness.invalid VITE_SUPABASE_ANON_KEY=e2e-public-anon-key \
            npm run build -- --outDir "$RUNNER_TEMP/ci-build/startup" --emptyOutDir
          node tools/ci/build-artifact.mjs record "$RUNNER_TEMP/ci-build"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-build-${{ github.run_id }}
          path: ${{ runner.temp }}/ci-build
          if-no-files-found: error
          overwrite: true
          retention-days: 7
  public-browsers:
    needs: [format, build]
    name: Public, admin and visual browsers (${{ matrix.shard }}/2)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      E2E_GROUP: public
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-node
        with:
          cache: ${{ env.CI_CACHE }}
      - uses: ./.github/actions/ci-browsers
        with:
          engines: chromium firefox webkit
          cache: ${{ env.CI_CACHE }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ci-build-${{ github.run_id }}
          path: ${{ runner.temp }}/ci-build
      - name: Verify build and discover every assigned browser case
        run: |
          node tools/ci/build-artifact.mjs verify "$RUNNER_TEMP/ci-build"
          npx playwright test --shard=${{ matrix.shard }}/2 --list --reporter=json > "$RUNNER_TEMP/expected.json"
      - name: Exercise every public, admin and visual contract
        run: npx playwright test --shard=${{ matrix.shard }}/2
      - name: Reject missing, skipped or retried outcomes and source drift
        run: |
          node tools/ci/verify-playwright-report.mjs "$RUNNER_TEMP/expected.json" test-results/results.json
          node tools/ci/build-artifact.mjs verify-source "$RUNNER_TEMP/ci-source"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: public-browsers-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            test-results
            playwright-report
            ${{ runner.temp }}/expected.json
          retention-days: 14
  cms:
    needs: format
    name: CMS contracts (${{ matrix.engine }}, ${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
        shard: [1, 2, 3, 4]
    env:
      E2E_GROUP: cms
      AXE_PATH: ${{ github.workspace }}/node_modules/axe-core/axe.min.js
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-node
        with:
          cache: ${{ env.CI_CACHE }}
      - uses: ./.github/actions/ci-browsers
        with:
          engines: ${{ matrix.engine }}
          cache: ${{ env.CI_CACHE }}
      - name: Discover every assigned CMS case
        run: npx playwright test --project=cms-${{ matrix.engine }} --shard=${{ matrix.shard }}/4 --list --reporter=json > "$RUNNER_TEMP/expected.json"
      - name: Exercise the unchanged CMS domain contracts
        run: npx playwright test --project=cms-${{ matrix.engine }} --shard=${{ matrix.shard }}/4
      - name: Reject missing, skipped or retried outcomes and source drift
        run: |
          node tools/ci/verify-playwright-report.mjs "$RUNNER_TEMP/expected.json" test-results/results.json
          node tools/ci/build-artifact.mjs verify-source "$RUNNER_TEMP/ci-source"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: cms-${{ matrix.engine }}-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            test-results
            playwright-report
            ${{ runner.temp }}/expected.json
            /tmp/cms-native-*
            /tmp/cms-projection-*
            /tmp/cms-responsive-*
            /tmp/cms-scenes-*
            /tmp/cms-populated-*
          retention-days: 14
  startup:
    needs: [format, build]
    name: Production startup (${{ matrix.engine }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    env:
      E2E_GROUP: startup
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-node
        with:
          cache: ${{ env.CI_CACHE }}
      - uses: ./.github/actions/ci-browsers
        with:
          engines: ${{ matrix.engine }}
          cache: ${{ env.CI_CACHE }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ci-build-${{ github.run_id }}
          path: ${{ runner.temp }}/ci-build
      - name: Verify build and discover every production startup case
        run: |
          node tools/ci/build-artifact.mjs verify "$RUNNER_TEMP/ci-build"
          npx playwright test --project=startup-${{ matrix.engine }} --list --reporter=json > "$RUNNER_TEMP/expected.json"
      - name: Exercise actual production builds under CSP
        run: npx playwright test --project=startup-${{ matrix.engine }}
      - name: Reject missing, skipped or retried outcomes and source drift
        run: |
          node tools/ci/verify-playwright-report.mjs "$RUNNER_TEMP/expected.json" test-results/results.json
          node tools/ci/build-artifact.mjs verify-source "$RUNNER_TEMP/ci-source"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: startup-${{ matrix.engine }}-${{ github.run_attempt }}
          path: |
            test-results
            playwright-report
            ${{ runner.temp }}/expected.json
          retention-days: 14
  edge-functions:
    needs: format
    name: Edge Functions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-node
        with:
          cache: ${{ env.CI_CACHE }}
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.9.5
      - name: Type-check every Edge Function entrypoint
        run: |
          while IFS= read -r file; do
            deno check --frozen --node-modules-dir=manual "$file"
          done < <(find supabase/functions -mindepth 2 -maxdepth 2 -name index.ts -print | sort)
  database-current:
    needs: format
    name: Current schema, integration and customer browsers
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      E2E_GROUP: customer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-node
        with:
          cache: ${{ env.CI_CACHE }}
      - uses: ./.github/actions/ci-browsers
        with:
          engines: chromium firefox webkit
          cache: ${{ env.CI_CACHE }}
      - name: Configure local Edge Function test secrets
        run: |
          cat > supabase/functions/.env <<'EOF'
          TURNSTILE_SECRET=1x0000000000000000000000000000000AA
          IP_SALT=ci-booking-ip-salt-not-for-production
          PUBLIC_ACTION_HASH_SALT=ci-public-action-hash-salt-not-for-production
          CUSTOMER_GATEWAY_SECRET=ci-customer-gateway-secret-not-for-production
          PUBLIC_SITE_ORIGINS=http://127.0.0.1:4173,https://127.0.0.1:4197
          CMS_ALLOWED_ORIGINS=https://127.0.0.1:4197
          PUBLIC_SUPABASE_URL=http://127.0.0.1:54321
          EOF
      - name: Start actual current Supabase stack
        # Keep Auth, Storage, Realtime, gateway, mail and Edge runtime; omit only tooling.
        run: npx supabase start --exclude studio,postgres-meta,supavisor
      - name: pgTAP against every current migration
        run: npx supabase test db --local
      - run: npm run test:integration
      - name: CMS resource reuse through real Edge and Storage
        env:
          CMS_TEST_ORIGIN: https://127.0.0.1:4197
        run: node tools/e2e/cms-asset-copy.mjs
      - name: Discover all customer engine contracts
        run: npx playwright test --list --reporter=json > "$RUNNER_TEMP/expected.json"
      - name: Customer browsers through actual Worker, Edge and HTTPS cookies
        run: npx playwright test
      - name: Reject missing, skipped or retried outcomes and source drift
        run: |
          node tools/ci/verify-playwright-report.mjs "$RUNNER_TEMP/expected.json" test-results/results.json
          node tools/ci/build-artifact.mjs verify-source "$RUNNER_TEMP/ci-source"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: customer-browser-${{ github.run_attempt }}
          path: |
            test-results
            playwright-report
            ${{ runner.temp }}/expected.json
            /tmp/knc-customer-e2e-*/*.png
            /tmp/knc-customer-e2e-*/*.json
            /tmp/knc-customer-e2e-*/*.log
          retention-days: 14
      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup
  database-rollout:
    needs: format
    name: Historical expand and contract compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-node
        with:
          cache: ${{ env.CI_CACHE }}
      - name: Start isolated DB for destructive historical checks
        run: npx supabase start --exclude gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Verify both original migration rollout stages
        run: bash tools/release/test-public-booking-stages.sh
      - name: Stop isolated database
        if: always()
        run: npx supabase stop --no-backup
  frontend:
    name: Frontend and browser
    if: always()
    needs: [format, quality, build, public-browsers, cms, startup]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Enforce every frontend and CMS gate
        shell: bash
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node tools/ci/check-gate.mjs format quality build public-browsers cms startup
  database:
    name: Database and integration
    if: always()
    needs: [database-current, database-rollout]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Enforce current and historical database gates
        shell: bash
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node tools/ci/check-gate.mjs database-current database-rollout
