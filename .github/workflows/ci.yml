name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend and browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - name: Check formatting and show required changes
        run: |
          if ! npm run format:check; then
            while IFS= read -r file; do
              npx prettier "$file" | diff -u "$file" - || true
            done < <(npx prettier --list-different .)
            exit 1
          fi
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run deploy:dry-run
      - name: Reject unlicensed legacy font artifacts
        run: |
          test -z "$(find public -type f \( -name 'SF-Pro*' -o -name '*San-Francisco*' \) -print)"
          ! grep -aERn 'Apple Inc\.|SF Pro|SF-Pro' dist
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Browser smoke
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/blade-preview.log 2>&1 &
          preview_pid=$!
          VITE_SUPABASE_URL=https://admin-harness.invalid VITE_SUPABASE_ANON_KEY=e2e-public-anon-key npm run dev -- --host 127.0.0.1 --port 4188 > /tmp/blade-admin-harness.log 2>&1 &
          admin_harness_pid=$!
          trap 'kill "$preview_pid" "$admin_harness_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4188/ >/dev/null && break
            sleep 1
          done
          BASE_URL=http://127.0.0.1:4173 npm run test:e2e
          BASE_URL=http://127.0.0.1:4188 npm run test:e2e:admin
          BASE=http://127.0.0.1:4173 OUT=/tmp/visual-candidate node tools/visual/capture.mjs
          BASELINE=tools/visual/baseline-linux CANDIDATE=/tmp/visual-candidate DIFF=/tmp/visual-diff node tools/visual/compare.mjs
      - name: Preserve failed visual comparisons
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-failure-${{ github.run_attempt }}
          path: |
            /tmp/visual-candidate/*.png
            /tmp/visual-diff/*.png
          retention-days: 7

  cms-shell:
    name: CMS shell browsers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Real desktop and mobile CMS shell
        run: |
          VITE_SUPABASE_URL=https://admin-harness.invalid VITE_SUPABASE_ANON_KEY=e2e-public-anon-key npm run dev -- --host 127.0.0.1 --port 4188 > /tmp/blade-cms-shell.log 2>&1 &
          dev_pid=$!
          trap 'kill "$dev_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4188/tools/e2e/admin-harness.html >/dev/null && break
            sleep 1
          done
          BASE_URL=http://127.0.0.1:4188 ADMIN_E2E_SCENARIO=cms-shell npm run test:e2e:admin
          BASE_URL=http://127.0.0.1:4188 node tools/e2e/cms-native.mjs
          status=0
          BASE_URL=http://127.0.0.1:4188 node tools/e2e/cms-owner.mjs || status=1
          BASE_URL=http://127.0.0.1:4188 node tools/e2e/cms-populated.mjs || status=1
          exit "$status"
      - name: Preserve CMS browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cms-browser-${{ github.run_attempt }}
          path: |
            /tmp/cms-native-*.png
            /tmp/blade-cms-shell.log
          retention-days: 7

  edge-functions:
    name: Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.9.5
      - run: npm ci
      - name: Type-check every Edge Function entrypoint
        run: |
          while IFS= read -r file; do
            deno check --frozen --node-modules-dir=manual "$file"
          done < <(find supabase/functions -mindepth 2 -maxdepth 2 -name index.ts -print | sort)

  database:
    name: Database and integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Configure local Edge Function test secrets
        run: |
          cat > supabase/functions/.env <<'EOF'
          TURNSTILE_SECRET=1x0000000000000000000000000000000AA
          IP_SALT=ci-booking-ip-salt-not-for-production
          PUBLIC_ACTION_HASH_SALT=ci-public-action-hash-salt-not-for-production
          CUSTOMER_GATEWAY_SECRET=ci-customer-gateway-secret-not-for-production
          PUBLIC_SITE_ORIGINS=http://127.0.0.1:4173,https://127.0.0.1:4197
          PUBLIC_SUPABASE_URL=http://127.0.0.1:54321
          EOF
      - name: Start local Supabase
        run: npx supabase start
      - name: Public booking rollout compatibility
        run: bash tools/release/test-public-booking-stages.sh
      - name: Restore current schema after historical rollout checks
        run: npx supabase db reset --local
      - name: pgTAP
        run: npx supabase test db --local
      - name: Adapter integration tests
        run: npm run test:integration
      - name: Install customer browser engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Customer browser through local Worker and Edge
        run: npm run test:e2e -- --customer
      - name: Preserve failed customer screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: customer-failure-${{ github.run_attempt }}
          path: /tmp/knc-customer-e2e-*/*-failure.png
          retention-days: 7
      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup
