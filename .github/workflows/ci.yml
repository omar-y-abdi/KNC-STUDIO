name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      cold-cache:
        description: Run every gate without dependency or browser caches.
        type: boolean
        default: false
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  CI_CACHE: ${{ !inputs.cold-cache }}
defaults:
  run:
    shell: bash
jobs:
  format:
    name: Auto-format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-node
        with:
          formatted: 'false'
          cache: ${{ env.CI_CACHE }}
      - name: Format and verify supported files
        run: bash tools/ci/format.sh
      - name: Record the exact tested source
        run: node tools/ci/build-artifact.mjs source "$RUNNER_TEMP"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Stable per-run names let failed consumers be re-run independently.
          name: ci-source-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/format.patch
            ${{ runner.temp }}/source.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7
  quality:
    needs: format
    name: Static checks and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-node
        with:
          cache: ${{ env.CI_CACHE }}
      - name: Prepare Furl regression dependencies
        run: bash tools/ci/setup-furl.sh
      - name: Verify CI orchestration and failure paths
        run: |
          node tools/modules/boundaries.mjs
          node --test tools/modules/test*.mjs
          node --test tools/ci/test-*.mjs
          python3 -m unittest discover -s tools/ci -p 'test_furl_ci.py' -v
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - name: Check CMS backend release stamp
        run: node tools/release/cms-release.mjs check
      - name: Reject source drift
        run: node tools/ci/build-artifact.mjs verify-source .ci-source
  build:
    needs: format
    name: Production builds and Worker packaging
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-node
        with:
          cache: ${{ env.CI_CACHE }}
      - run: npm run build
      - run: npm run bundle-budget
      - name: Package actual Worker without rebuilding assets
        run: npx wrangler deploy --dry-run
      - name: Reject unlicensed legacy font artifacts
        run: |
          test -z "$(find public -type f \( -name 'SF-Pro*' -o -name '*San-Francisco*' \) -print)"
          ! grep -aERn 'Apple Inc\.|SF Pro|SF-Pro' dist
      - name: Build the harness test build once for the public and startup browsers
        # Browser tests must never reach production: both groups run against a bundle that embeds
        # the fake Supabase origin, never the production URL from .env (see network-guard.mjs).
        run: |
          mkdir -p "$RUNNER_TEMP/ci-build"
          VITE_SUPABASE_URL=https://admin-harness.invalid VITE_SUPABASE_ANON_KEY=e2e-public-anon-key \
            npm run build -- --outDir "$RUNNER_TEMP/ci-build/startup" --emptyOutDir
          cp -a "$RUNNER_TEMP/ci-build/startup" "$RUNNER_TEMP/ci-build/public"
          node tools/ci/build-artifact.mjs record "$RUNNER_TEMP/ci-build"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-build-${{ github.run_id }}
          path: ${{ runner.temp }}/ci-build
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Reject source drift
        run: node tools/ci/build-artifact.mjs verify-source .ci-source
  public-browsers:
    needs: [format, build]
    name: Public, admin and visual browsers (${{ matrix.shard }}/2)
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --user 1001 --ipc=host
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      E2E_GROUP: public
      E2E_PUBLIC_DIST: .ci-build/public
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-node
        with:
          cache: ${{ env.CI_CACHE }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-build-${{ github.run_id }}
          path: .ci-build
      - name: Verify build and discover every assigned browser case
        run: |
          node tools/ci/build-artifact.mjs verify .ci-build
          npx playwright test --shard=${{ matrix.shard }}/2 --list --reporter=json > .ci-expected.json
      - name: Exercise every public, admin and visual contract
        run: npx playwright test --shard=${{ matrix.shard }}/2
      - name: Reject missing, skipped or retried outcomes and source drift
        run: |
          node tools/ci/verify-playwright-report.mjs .ci-expected.json test-results/results.json
          node tools/ci/build-artifact.mjs verify-source .ci-source
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: public-browsers-${{ matrix.shard }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            test-results
            playwright-report
            .ci-expected.json
          retention-days: 14
  cms:
    needs: format
    name: CMS contracts (${{ matrix.engine }}, ${{ matrix.shard }}/9)
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --user 1001 --ipc=host
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
        shard: [1, 2, 3, 4, 5, 6, 7, 8, 9]
    env:
      E2E_GROUP: cms
      AXE_PATH: node_modules/axe-core/axe.min.js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-node
        with:
          cache: ${{ env.CI_CACHE }}
      - name: Discover every assigned CMS case
        run: npx playwright test --project=cms-${{ matrix.engine }} --shard=${{ matrix.shard }}/9 --list --reporter=json > .ci-expected.json
      - name: Exercise the unchanged CMS domain contracts
        run: npx playwright test --project=cms-${{ matrix.engine }} --shard=${{ matrix.shard }}/9
      - name: Reject missing, skipped or retried outcomes and source drift
        run: |
          node tools/ci/verify-playwright-report.mjs .ci-expected.json test-results/results.json
          node tools/ci/build-artifact.mjs verify-source .ci-source
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cms-${{ matrix.engine }}-${{ matrix.shard }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            test-results
            playwright-report
            .ci-expected.json
            /tmp/cms-native-*
            /tmp/cms-projection-*
            /tmp/cms-responsive-*
            /tmp/cms-scenes-*
            /tmp/cms-populated-*
          retention-days: 14
  startup:
    needs: [format, build]
    name: Production startup (${{ matrix.engine }})
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --user 1001 --ipc=host
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    env:
      E2E_GROUP: startup
      E2E_STARTUP_DIST: .ci-build/startup
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-node
        with:
          cache: ${{ env.CI_CACHE }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-build-${{ github.run_id }}
          path: .ci-build
      - name: Verify build and discover every production startup case
        run: |
          node tools/ci/build-artifact.mjs verify .ci-build
          npx playwright test --project=startup-${{ matrix.engine }} --list --reporter=json > .ci-expected.json
      - name: Exercise actual production builds under CSP
        run: npx playwright test --project=startup-${{ matrix.engine }}
      - name: Reject missing, skipped or retried outcomes and source drift
        run: |
          node tools/ci/verify-playwright-report.mjs .ci-expected.json test-results/results.json
          node tools/ci/build-artifact.mjs verify-source .ci-source
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: startup-${{ matrix.engine }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            test-results
            playwright-report
            .ci-expected.json
          retention-days: 14
  edge-functions:
    needs: format
    name: Edge Functions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-node
        with:
          cache: ${{ env.CI_CACHE }}
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.9.5
      - name: Type-check every Edge Function entrypoint
        working-directory: supabase/functions
        run: |
          checked=0
          while IFS= read -r file; do
            deno check --config deno.json --frozen "$file"
            checked=$((checked + 1))
            printf 'PASS %s\n' "$file"
          done < <(find . -mindepth 2 -maxdepth 2 -name index.ts -print | sort)
          test "$checked" -gt 0
      - name: Reject source drift
        run: node tools/ci/build-artifact.mjs verify-source .ci-source
  database-current:
    needs: format
    name: Current schema, integration and customer browsers
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      E2E_GROUP: customer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-node
        with:
          cache: ${{ env.CI_CACHE }}
      - uses: ./.github/actions/ci-browsers
        with:
          engines: chromium firefox webkit
          cache: ${{ env.CI_CACHE }}
      - name: Configure local Edge Function test secrets
        run: |
          cat > supabase/functions/.env <<'EOF'
          TURNSTILE_SECRET=1x0000000000000000000000000000000AA
          IP_SALT=ci-booking-ip-salt-not-for-production
          PUBLIC_ACTION_HASH_SALT=ci-public-action-hash-salt-not-for-production
          CUSTOMER_GATEWAY_SECRET=ci-customer-gateway-secret-not-for-production
          PUBLIC_SITE_ORIGINS=http://127.0.0.1:4173,https://127.0.0.1:4197
          CMS_ALLOWED_ORIGINS=https://127.0.0.1:4197
          PUBLIC_SUPABASE_URL=http://127.0.0.1:54321
          EOF
      - name: Start actual current Supabase stack
        # Keep Auth, Storage, Realtime, gateway, mail and Edge runtime; omit only tooling.
        run: npx supabase start --exclude studio,postgres-meta,supavisor
      - name: pgTAP against every current migration
        run: npx supabase test db --local
      - run: npm run test:integration
      - name: CMS resource reuse through real Edge and Storage
        env:
          CMS_TEST_ORIGIN: https://127.0.0.1:4197
        run: node tools/e2e/cms-asset-copy.mjs
      - name: Discover all customer engine contracts
        run: npx playwright test --list --reporter=json > "$RUNNER_TEMP/expected.json"
      - name: Customer browsers through actual Worker, Edge and HTTPS cookies
        run: npx playwright test
      - name: Reject missing, skipped or retried outcomes and source drift
        run: |
          node tools/ci/verify-playwright-report.mjs "$RUNNER_TEMP/expected.json" test-results/results.json
          node tools/ci/build-artifact.mjs verify-source .ci-source
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: customer-browser-${{ github.run_attempt }}
          path: |
            test-results
            playwright-report
            ${{ runner.temp }}/expected.json
            /tmp/knc-customer-e2e-*/*.png
            /tmp/knc-customer-e2e-*/*.json
            /tmp/knc-customer-e2e-*/*.log
          retention-days: 14
      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup
  frontend:
    name: Frontend and browser
    if: always()
    needs: [format, quality, build, public-browsers, cms, startup, edge-functions]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enforce every frontend and CMS gate
        shell: bash
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node tools/ci/check-gate.mjs format quality build public-browsers cms startup edge-functions
  database:
    name: Database and integration
    if: always()
    needs: [format, database-current]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enforce the current database gate
        shell: bash
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node tools/ci/check-gate.mjs format database-current
