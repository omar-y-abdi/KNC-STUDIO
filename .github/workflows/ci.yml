name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-touch-diagnostic:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001 --ipc=host
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        input: [synthetic, mobile, dispatch]
    env:
      E2E_GROUP: cms
      MOBILE_PAINT_INPUT: ${{ matrix.input }}
      NPM_CONFIG_CACHE: ${{ runner.temp }}/npm-cache
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - name: One native input case with unchanged pixel oracle
        run: npx playwright test tools/e2e/cms-mobile-scroll-carrier.chromium.spec.mjs --project=cms-chromium --grep 'source, reduce' --workers=1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-touch-${{ matrix.input }}
          path: |
            test-results
            playwright-report
          retention-days: 3
