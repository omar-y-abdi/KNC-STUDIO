name: View-state Prettier probe

on:
  push:
    branches:
      - tmp/viewstate-prettier-probe-20260918

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Print canonical view-state formatting
        run: npx prettier src/admin/cms/viewState.ts
