name: CMS touch and landscape verification
on:
  push:
    branches: [verify/cms-workspace-a11y-20260922]
    paths: [.github/workflows/cms-edge-verification.yml]
permissions:
  contents: read
defaults:
  run:
    shell: python3 tools/ci/furl_ci.py {0}
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: aca22b5458bdd9b49dfd405c00bdcd3309068aa8
          persist-credentials: false
      - name: Set up Furl
        shell: bash
        run: bash tools/ci/setup-furl.sh
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - name: Prepare remote browser inspection
        run: |
          mkdir -p /tmp/cms-edge
          git rev-parse HEAD > /tmp/cms-edge/source-commit.txt
          git rev-parse HEAD^{tree} > /tmp/cms-edge/source-tree.txt
          test "$(git rev-parse HEAD^{tree})" = d745d5cdd1d7e20f09fae2a454de61186c3152a6
          npm ci
          npx playwright install --with-deps chromium webkit
          VITE_SUPABASE_URL=https://admin-harness.invalid VITE_SUPABASE_ANON_KEY=e2e-public-anon-key npm run dev -- --host 127.0.0.1 --port 4188 > /tmp/cms-edge/server.log 2>&1 &
      - name: Check real touch targets and short viewports
        run: |
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:4188/tools/e2e/admin-harness.html > /dev/null && break; sleep 1; done
          cat > tools/e2e/cms-edge-check.mjs <<'JS'
          import assert from 'node:assert/strict'
          import { writeFile } from 'node:fs/promises'
          import { chromium, webkit } from 'playwright'
          import { nativeBackend } from './cms-native.mjs'
          const results = []
          const failures = []
          for (const [engine, name] of [[chromium, 'chromium'], [webkit, 'webkit']]) {
            const browser = await engine.launch()
            try {
              for (const [width,height,touch] of [[1920,1080,false],[390,844,true],[844,390,true]]) {
                const context = await browser.newContext({viewport:{width,height},hasTouch:touch,isMobile:touch,reducedMotion:'reduce'})
                context.setDefaultTimeout(15000)
                const backend = await nativeBackend(context)
                const page = await context.newPage()
                const prefix = `${name}-${width}x${height}`
                const activate = node => touch ? node.tap() : node.click()
                const capture = async state => {
                  await page.screenshot({path:`/tmp/cms-edge/${prefix}-${state}.png`})
                  const metrics = await page.evaluate(() => {
                    const button = document.querySelector('.cms-publish')
                    const r = button.getBoundingClientRect()
                    const body = document.querySelector('.cms-workspace-content')
                    return {overflow:document.documentElement.scrollWidth>innerWidth,publish:button.contains(document.elementFromPoint(r.x+r.width/2,r.y+r.height/2)),bodyHeight:body?.clientHeight}
                  })
                  results.push({prefix,state,metrics})
                  assert.ok(!metrics.overflow, `${prefix}/${state}: horizontal overflow`)
                  assert.ok(metrics.publish, `${prefix}/${state}: publication obscured`)
                  if (metrics.bodyHeight !== undefined) assert.ok(metrics.bodyHeight >= 100, `${prefix}/${state}: workspace too short to use (${metrics.bodyHeight}px)`)
                }
                try {
                  await page.goto('http://127.0.0.1:4188/tools/e2e/admin-harness.html?view=cms-studio')
                  await page.evaluate(async () => (await import('/tools/e2e/admin-harness.tsx')).mountCmsStudioHarness())
                  await page.locator('.cms-canvas-shell').waitFor({timeout:90000})
                  await page.frameLocator('.gjs-frame').first().locator(`[data-knc-surface="${touch?'mobile':'desktop'}-home"]`).waitFor()
                  await capture('editor')
                  if (touch) {
                    await activate(page.locator('.cms-mobile-tools').getByRole('button',{name:'Sidor',exact:true}))
                    await page.screenshot({path:`/tmp/cms-edge/${prefix}-drawer.png`})
                  }
                  await activate(page.getByRole('button',{name:'Business / SEO',exact:true}))
                  await page.getByRole('region',{name:'Företag & sökresultat'}).waitFor()
                  await capture('business')
                  await activate(page.getByRole('button',{name:'Tillbaka till sidan',exact:true}))
                  if(touch) await activate(page.locator('.cms-mobile-tools').getByRole('button',{name:'Sidor',exact:true}))
                  await activate(page.getByRole('button',{name:'◐ Webbplatsens stil',exact:true}))
                  if (touch) {
                    // A hidden preview must survive time spent editing before it is shown.
                    if(width===390) await new Promise(resolve=>setTimeout(resolve,22000))
                    await activate(page.getByRole('button',{name:'Förhandsvisa stil',exact:true}))
                  }
                  await page.waitForFunction(()=>document.querySelector('.cms-live-preview')?.dataset.previewState==='ready',null,{timeout:30000})
                  await capture('theme')
                  assert.equal(backend.writes.length,0)
                } catch(error) {
                  failures.push(`${prefix}: ${error.message}`)
                  await page.screenshot({path:`/tmp/cms-edge/${prefix}-failure.png`}).catch(()=>{})
                } finally { await context.close() }
              }
            } finally { await browser.close() }
          }
          await writeFile('/tmp/cms-edge/report.json',JSON.stringify({results,failures},null,2))
          console.log(JSON.stringify({results,failures},null,2))
          assert.deepEqual(failures,[])
          JS
          set +e
          node tools/e2e/cms-edge-check.mjs > /tmp/cms-edge/checks.log 2>&1
          status=$?
          set -e
          furl compress /tmp/cms-edge/checks.log --json > /tmp/cms-edge/checks.furl.json
          exit "$status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cms-touch-landscape
          path: /tmp/cms-edge
          retention-days: 7
