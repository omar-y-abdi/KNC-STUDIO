name: CMS correction candidate

on:
  pull_request:
    paths:
      - tools/cms-candidate.py
      - .github/workflows/cms-candidate.yml

permissions:
  contents: read

jobs:
  verify:
    if: github.event.pull_request.number == 67 && github.event.pull_request.head.ref == 'CMS-improve' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply pinned correction
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/cms-candidate.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/e2e/cms-native.mjs')
          source = p.read_text()
          source = source.replace("  page.on('pageerror', (error) => errors.push(error.message))", "  page.on('pageerror', (error) => { errors.push(error.message); console.error('PAGE_ERROR', error.message) })\n  page.on('console', (message) => { if (message.type() === 'error') console.error('BROWSER', message.text()) })")
          source = source.replace('  } finally { await browser.close() }', '''  } catch (error) {
              console.error('EDITOR_BODY', (await page.locator('body').innerText()).slice(0, 5000))
              console.error('PAGE_ERRORS', errors)
              await page.screenshot({ path: `/tmp/cms-native-${name}-failure.png` })
              for (const frame of page.frames()) console.error('FRAME', frame.url(), await frame.evaluate(() => ({
                status: { ...globalThis.document.documentElement.dataset },
                surfaces: [...globalThis.document.querySelectorAll('[data-knc-surface]')].map((node) => node.getAttribute('data-knc-surface')),
              })).catch(() => 'detached'))
              throw error
            } finally { await browser.close() }''')
          p.write_text(source)
          p = Path('src/admin/cms/NativeSource.tsx')
          source = p.read_text().replace("        document.documentElement.dataset['kncSourceError'] = context.id", "        document.documentElement.dataset['kncSourceFailure'] = JSON.stringify({ context, ...state.status, surfaces: [...document.querySelectorAll('[data-knc-surface]')].map((node) => node.getAttribute('data-knc-surface')), fonts: document.fonts.status, booking: document.documentElement.dataset['kncBookingReady'] })\n        document.documentElement.dataset['kncSourceError'] = context.id")
          p.write_text(source)
          p = Path('src/admin/cms/nativePages.ts')
          source = p.read_text().replace("throw new Error('Webbplatsens källdata kunde inte läsas. Utkastet har inte ändrats.')", "throw new Error('Källan kunde inte läsas: ' + document.documentElement.dataset['kncSourceFailure'])")
          p.write_text(source)
          PY
      - name: Format changed source
        run: |
          npx prettier --write tests/unit/cmsNativeTree.test.ts
          git add -N .
          git diff --name-only --diff-filter=ACMR -z | xargs -0 --no-run-if-empty npx prettier --write --ignore-unknown
      - run: npm run format:check
      - name: Independent lint, type and unit checks
        run: |
          failed=0
          npm run lint || failed=1
          npm run typecheck || failed=1
          npm test || failed=1
          exit "$failed"
      - run: npm run build
      - name: Export compiled source identities without changing refs or workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, json, os, subprocess, urllib.request
          from pathlib import Path
          subprocess.run(['git', 'add', '-A'], check=True)
          changes = subprocess.check_output(['git', 'diff', '--cached', '--name-status', '--no-renames'], text=True)
          manifest = []
          for entry in changes.splitlines():
              status, path = entry.split('\t')
              assert path.startswith(('src/', 'shared/', 'tests/', 'tools/', '.github/'))
              sha = None
              if status != 'D':
                  request = urllib.request.Request('https://api.github.com/repos/omar-y-abdi/KNC-STUDIO/git/blobs',
                      data=json.dumps({'content': base64.b64encode(Path(path).read_bytes()).decode(), 'encoding': 'base64'}).encode(),
                      headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Content-Type': 'application/json'}, method='POST')
                  with urllib.request.urlopen(request) as response:
                      sha = json.load(response)['sha']
              manifest.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': sha})
          print('CANDIDATE_FILES=' + json.dumps(manifest))
          PY
      - run: npx playwright install --with-deps chromium webkit
      - name: Actual-site editor behavior
        run: |
          VITE_SUPABASE_URL=https://admin-harness.invalid VITE_SUPABASE_ANON_KEY=e2e-public-anon-key npm run dev -- --host 127.0.0.1 --port 4188 >/tmp/cms-native-vite.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true; cat /tmp/cms-native-vite.log' EXIT
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4188/ >/dev/null && break
            sleep 1
          done
          BASE_URL=http://127.0.0.1:4188 node tools/e2e/cms-native.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cms-native-verification
          path: |
            /tmp/cms-native-*.png
            /tmp/cms-native-vite.log
          retention-days: 3
