name: CMS visual verification
on:
  push:
    branches: [verify/cms-visual-refinement-20260922]
    paths: [.github/workflows/cms-visual-verification.yml, .cms-verification/**]
permissions:
  contents: write
concurrency:
  group: cms-visual-verification
  cancel-in-progress: true
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare remote verification tools
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit
          mkdir -p /tmp/cms-workspace
          curl -fL 'https://github.com/omar-y-abdi/furl-ctx/releases/download/v1.4.0/furl_ctx-1.4.0-cp310-abi3-manylinux_2_28_x86_64.whl' -o /tmp/furl_ctx-1.4.0-cp310-abi3-manylinux_2_28_x86_64.whl
          echo '3b1236a0398b5959cd35dfa9b84ababb59949fa88c1a62aef709dedaba2a82e5  /tmp/furl_ctx-1.4.0-cp310-abi3-manylinux_2_28_x86_64.whl' | sha256sum -c -
          python -m pip install /tmp/furl_ctx-1.4.0-cp310-abi3-manylinux_2_28_x86_64.whl
      - name: Start isolated CMS fixture server
        run: |
          VITE_SUPABASE_URL=https://admin-harness.invalid VITE_SUPABASE_ANON_KEY=e2e-public-anon-key npm run dev -- --host 127.0.0.1 --port 4188 > /tmp/cms-workspace/server.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:4188/tools/e2e/admin-harness.html > /dev/null && break; sleep 1; done
      - name: Exercise responsive and keyboard acceptance contracts
        env:
          CMS_EVIDENCE_DIR: /tmp/cms-workspace
        run: |
          cp .cms-verification/contracts.mjs tools/e2e/cms-workspace-contracts.mjs
          set +e
          node tools/e2e/cms-workspace-contracts.mjs > /tmp/cms-workspace/contracts.log 2>&1
          status=$?
          set -e
          echo "$status" > /tmp/cms-workspace/contracts.exit-code
          furl compress /tmp/cms-workspace/contracts.log --json > /tmp/cms-workspace/contracts.furl.json
          exit "$status"
      - name: Record source identity
        if: always()
        run: |
          git rev-parse HEAD > /tmp/cms-workspace/verification-commit.txt
          git rev-parse c47fff39948823dd9651d2d72e002f3daa7cd2e2^{tree} > /tmp/cms-workspace/source-tree.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cms-workspace-contracts-${{ github.run_number }}
          path: /tmp/cms-workspace
          retention-days: 7
