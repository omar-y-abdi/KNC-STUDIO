name: CMS visual verification
on:
  push:
    branches: [verify/cms-workspace-a11y-20260922]
    paths: [.github/workflows/cms-visual-verification.yml, .cms-verification/**]
permissions:
  contents: read
concurrency:
  group: cms-workspace-a11y-verification
  cancel-in-progress: true
defaults:
  run:
    shell: python3 tools/ci/furl_ci.py {0}
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      tree: ${{ steps.source.outputs.tree }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Set up Furl
        shell: bash
        run: bash tools/ci/setup-furl.sh
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - name: Materialize and format exact candidate
        id: source
        env:
          BASE: beee2ce95a3b5f5dbaf8b5c20ef735c7a8d269fb
          PR_HEAD: eaca9b67af86777459f00f18f6e20c12d00ba0f4
        run: |
          set -euo pipefail
          mkdir -p /tmp/cms-source
          git fetch origin --prune
          test "$(git rev-parse origin/codex/cms-flow-scenes)" = "$PR_HEAD"
          git worktree add --detach /tmp/cms-candidate "$BASE"
          xz -dc .cms-verification/next.patch.xz | git -C /tmp/cms-candidate apply --index
          test "$(git -C /tmp/cms-candidate write-tree)" = "$(cat .cms-verification/expected-tree)"
          cd /tmp/cms-candidate
          npm ci
          bash tools/ci/format.sh
          cp "$RUNNER_TEMP/format.patch" /tmp/cms-source/format.patch
          git add -u
          git -c user.name='CMS verification' -c user.email='cms-verification@users.noreply.github.com' commit -m 'fix: fit mobile style previews and retain workspace regression gates'
          ref=refs/heads/verify/cms-candidate-current
          git push --force-with-lease="$ref:$BASE" origin "HEAD:$ref"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD > /tmp/cms-source/source-commit.txt
          git rev-parse HEAD^{tree} > /tmp/cms-source/source-tree.txt
          git update-ref refs/heads/cms-verified-export HEAD
          git bundle create /tmp/cms-source/candidate.bundle refs/heads/cms-verified-export
          git bundle verify /tmp/cms-source/candidate.bundle
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cms-candidate-source-${{ github.run_number }}
          path: /tmp/cms-source
          retention-days: 3
  verify:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: [static, chromium, webkit]
    env:
      BASE_URL: http://127.0.0.1:4188
      CMS_BROWSER: ${{ matrix.group }}
      CMS_EVIDENCE_DIR: /tmp/cms-workspace
      AXE_PATH: /tmp/cms-a11y/node_modules/axe-core/axe.min.js
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - name: Set up Furl
        shell: bash
        run: bash tools/ci/setup-furl.sh
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - name: Verify source identity
        run: |
          mkdir -p "$CMS_EVIDENCE_DIR"
          test "$(git rev-parse HEAD^{tree})" = '${{ needs.prepare.outputs.tree }}'
          git rev-parse HEAD > "$CMS_EVIDENCE_DIR/source-commit.txt"
          git rev-parse HEAD^{tree} > "$CMS_EVIDENCE_DIR/source-tree.txt"
          npm ci
      - name: Static gates
        if: matrix.group == 'static'
        run: |
          status=0
          for command in typecheck lint format:check test build; do
            result=0
            npm run "$command" > "$CMS_EVIDENCE_DIR/${command//:/-}.log" 2>&1 || result=$?
            echo "$result" > "$CMS_EVIDENCE_DIR/${command//:/-}.exit-code"
            if [ "$result" -ne 0 ]; then status=1; fi
          done
          exit "$status"
      - name: Browser tools
        if: matrix.group != 'static'
        run: |
          npx playwright install --with-deps "$CMS_BROWSER"
          npm install --prefix /tmp/cms-a11y --ignore-scripts --no-audit --no-fund axe-core@4.11.1
      - name: Permanent workspace browser gates
        if: matrix.group != 'static'
        run: |
          VITE_SUPABASE_URL=https://admin-harness.invalid VITE_SUPABASE_ANON_KEY=e2e-public-anon-key npm run dev -- --host 127.0.0.1 --port 4188 > "$CMS_EVIDENCE_DIR/server.log" 2>&1 &
          dev_pid=$!
          trap 'kill "$dev_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            curl --fail --silent "$BASE_URL/tools/e2e/admin-harness.html" >/dev/null && break
            sleep 1
          done
          status=0
          for suite in cms-workspace cms-preview-state cms-workspace-views cms-touch; do
            result=0
            node "tools/e2e/$suite.mjs" > "$CMS_EVIDENCE_DIR/$suite.log" 2>&1 || result=$?
            echo "$result" > "$CMS_EVIDENCE_DIR/$suite.exit-code"
            if [ "$result" -ne 0 ]; then status=1; fi
          done
          exit "$status"
      - name: Preserve compact logs and source invariants
        if: always()
        run: |
          for log in "$CMS_EVIDENCE_DIR"/*.log; do furl compress "$log" --json > "$log.furl.json"; done
          git diff --exit-code
          python3 - <<'PY'
          import json, pathlib
          p=pathlib.Path('/tmp/cms-workspace')
          checks={f.stem:int(f.read_text()) for f in p.glob('*.exit-code')}
          (p/'check-summary.json').write_text(json.dumps(checks,indent=2))
          print(json.dumps(checks,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cms-${{ matrix.group }}-evidence-${{ github.run_number }}
          path: /tmp/cms-workspace
          retention-days: 7
