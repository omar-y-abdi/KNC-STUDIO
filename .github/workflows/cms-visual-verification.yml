name: CMS visual verification
on:
  push:
    branches: [verify/cms-visual-refinement-20260922]
    paths: [.github/workflows/cms-visual-verification.yml, .cms-verification/**]
permissions:
  contents: write
concurrency:
  group: cms-visual-verification
  cancel-in-progress: true
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize exact candidate without transport files
        run: |
          set -euo pipefail
          mkdir -p /tmp/cms-workspace
          git worktree add --detach /tmp/cms-candidate aadafcb4b936d50ad4c90045de2607f63c62df31
          cat .cms-verification/fix-0.b64 .cms-verification/fix-1.b64 .cms-verification/fix-2.b64 | base64 -d | xz -d | git -C /tmp/cms-candidate apply --index
          actual=$(git -C /tmp/cms-candidate write-tree)
          test "$actual" = '4ff4917e8f91527d2ed41dd765162f78db488150'
          echo "$actual" > /tmp/cms-workspace/input-tree.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare remote verification tools and format changed files
        working-directory: /tmp/cms-candidate
        run: |
          set -euo pipefail
          npm ci > /tmp/cms-workspace/install.log 2>&1
          git diff --cached --name-only -z | xargs -0 npx prettier --write > /tmp/cms-workspace/format-write.log 2>&1
          git add -u
          git -c user.name='CMS verification' -c user.email='cms-verification@users.noreply.github.com' commit -m 'fix: isolate CMS drawers and verify all responsive workspace controls'
          git rev-parse HEAD > /tmp/cms-workspace/source-commit.txt
          git rev-parse HEAD^{tree} > /tmp/cms-workspace/source-tree.txt
          git push origin HEAD:refs/heads/verify/cms-candidate-${{ github.run_number }} > /tmp/cms-workspace/push.log 2>&1 || true
          npx playwright install --with-deps chromium webkit > /tmp/cms-workspace/browser-install.log 2>&1
          curl -fsSL 'https://github.com/omar-y-abdi/furl-ctx/releases/download/v1.4.0/furl_ctx-1.4.0-cp310-abi3-manylinux_2_28_x86_64.whl' -o /tmp/furl_ctx-1.4.0-cp310-abi3-manylinux_2_28_x86_64.whl
          echo '3b1236a0398b5959cd35dfa9b84ababb59949fa88c1a62aef709dedaba2a82e5  /tmp/furl_ctx-1.4.0-cp310-abi3-manylinux_2_28_x86_64.whl' | sha256sum -c -
          python -m pip install /tmp/furl_ctx-1.4.0-cp310-abi3-manylinux_2_28_x86_64.whl > /tmp/cms-workspace/furl-install.log 2>&1
      - name: Static checks, complete unit suite and production build
        working-directory: /tmp/cms-candidate
        run: |
          set +e
          for command in typecheck lint format:check test build; do
            npm run "$command" > "/tmp/cms-workspace/${command//:/-}.log" 2>&1
            echo "$?" > "/tmp/cms-workspace/${command//:/-}.exit-code"
          done
          exit 0
      - name: Start isolated CMS fixture server
        working-directory: /tmp/cms-candidate
        run: |
          VITE_SUPABASE_URL=https://admin-harness.invalid VITE_SUPABASE_ANON_KEY=e2e-public-anon-key npm run dev -- --host 127.0.0.1 --port 4188 > /tmp/cms-workspace/server.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:4188/tools/e2e/admin-harness.html > /dev/null && break; sleep 1; done
      - name: Responsive contracts and existing real editor regressions
        working-directory: /tmp/cms-candidate
        env:
          BASE_URL: http://127.0.0.1:4188
          CMS_EVIDENCE_DIR: /tmp/cms-workspace
        run: |
          set +e
          for suite in cms-workspace cms-native cms-responsive cms-owner cms-scenes; do
            node "tools/e2e/$suite.mjs" > "/tmp/cms-workspace/$suite.log" 2>&1
            echo "$?" > "/tmp/cms-workspace/$suite.exit-code"
          done
          ADMIN_E2E_SCENARIO=cms-shell node tools/e2e/admin-state.mjs > /tmp/cms-workspace/cms-shell.log 2>&1
          echo "$?" > /tmp/cms-workspace/cms-shell.exit-code
          exit 0
      - name: Capture every workspace surface in both engines
        working-directory: /tmp/cms-candidate
        env:
          BASE_URL: http://127.0.0.1:4188
          CMS_EVIDENCE_DIR: /tmp/cms-workspace
        run: |
          gzip -dc "$GITHUB_WORKSPACE/.cms-verification/capture.mjs.gz" > tools/e2e/cms-visual-surfaces.mjs
          set +e
          node tools/e2e/cms-visual-surfaces.mjs > /tmp/cms-workspace/surfaces.log 2>&1
          echo "$?" > /tmp/cms-workspace/surfaces.exit-code
          rm tools/e2e/cms-visual-surfaces.mjs
          exit 0
      - name: Compress logs and record exact evidence
        if: always()
        run: |
          mkdir -p /tmp/cms-workspace
          shopt -s nullglob
          git rev-parse HEAD > /tmp/cms-workspace/verification-commit.txt
          for image in /tmp/cms-native-*.png /tmp/cms-responsive-*.png; do cp "$image" /tmp/cms-workspace/; done
          if command -v furl > /dev/null; then
            for log in /tmp/cms-workspace/*.log; do furl compress "$log" --json > "$log.furl.json" || true; done
          fi
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path('/tmp/cms-workspace')
          checks={p.stem:int(p.read_text().strip()) for p in root.glob('*.exit-code')}
          (root/'check-summary.json').write_text(json.dumps(checks,indent=2))
          print(json.dumps(checks,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cms-candidate-evidence-${{ github.run_number }}
          path: /tmp/cms-workspace
          retention-days: 7
      - name: Preserve candidate source bundle
        if: always()
        run: git -C /tmp/cms-candidate bundle create /tmp/cms-candidate.bundle HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cms-candidate-source-${{ github.run_number }}
          path: /tmp/cms-candidate.bundle
          retention-days: 7
      - name: Enforce all completed gates
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('/tmp/cms-workspace/check-summary.json')
          checks=json.loads(p.read_text()) if p.exists() else {}
          required={'typecheck','lint','format-check','test','build','cms-workspace','cms-native','cms-responsive','cms-owner','cms-scenes','cms-shell','surfaces'}
          assert required.issubset(checks),f'Missing checks: {required-set(checks)}'
          assert all(value==0 for value in checks.values()),checks
          PY
