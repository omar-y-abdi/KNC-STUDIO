name: CMS preview state regression
on:
  push:
    branches: [verify/cms-workspace-a11y-20260922]
    paths: [.github/workflows/cms-preview-probe.yml, .cms-preview-check.mjs]
permissions:
  contents: read
defaults:
  run:
    shell: python3 tools/ci/furl_ci.py {0}
jobs:
  red:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Furl
        shell: bash
        run: bash tools/ci/setup-furl.sh
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
      - name: Prepare the unchanged implementation
        run: |
          mkdir -p /tmp/cms-preview
          git worktree add --detach /tmp/preview-source bc0f780cffc992d370d44bbea36f1614acda6247
          cp .cms-preview-check.mjs /tmp/preview-source/tools/e2e/cms-preview-state.mjs
          cd /tmp/preview-source
          npm ci
          npx playwright install --with-deps chromium webkit
          VITE_SUPABASE_URL=https://admin-harness.invalid VITE_SUPABASE_ANON_KEY=e2e-public-anon-key npm run dev -- --host 127.0.0.1 --port 4188 > /tmp/cms-preview/server.log 2>&1 &
      - name: Demonstrate the missing loading contract
        run: |
          cd /tmp/preview-source
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:4188/tools/e2e/admin-harness.html > /dev/null && break; sleep 1; done
          set +e
          node tools/e2e/cms-preview-state.mjs > /tmp/cms-preview/red.log 2>&1
          result=$?
          set -e
          furl compress /tmp/cms-preview/red.log --json > /tmp/cms-preview/red.furl.json
          test "$result" -ne 0
          grep -q 'Preview must expose loading before the iframe response' /tmp/cms-preview/red.log
          printf 'Expected regression reproduced on bc0f780cffc992d370d44bbea36f1614acda6247\n' > /tmp/cms-preview/result.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cms-preview-red
          path: /tmp/cms-preview
          retention-days: 3
