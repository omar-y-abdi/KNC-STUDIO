<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Present at load so iOS honours it; JS updates it to the panel surface per light/dark. -->
    <meta name="theme-color" content="#f4f3f0" />

    <title>KNC Studio – Barbershop i Göteborg | Boka tid online</title>
    <meta
      name="description"
      content="KNC Studio – barbershop på Geijersgatan 10 i Göteborg. Boka tid online hos Hassan, Victor eller Salman. Öppet mån–lör 09–18, klippning från 200 kr."
    />
    <link rel="canonical" href="%VITE_SITE_URL%/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- Preload the hero/display weights to avoid first-paint font swap. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/SF-Pro-Display-Bold.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/SF-Pro-Text-Regular.woff2" crossorigin />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="KNC Studio" />
    <meta property="og:title" content="KNC Studio – Barbershop i Göteborg" />
    <meta property="og:description" content="Boka tid online hos Hassan, Victor eller Salman. Geijersgatan 10, Göteborg. Öppet mån–lör 09–18." />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/images-mqlfpa5y.png" />
    <meta property="og:image:width" content="398" />
    <meta property="og:image:height" content="502" />
    <meta property="og:locale" content="sv_SE" />
    <meta property="og:locale:alternate" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="KNC Studio – Barbershop i Göteborg" />
    <meta name="twitter:description" content="Boka tid online. Geijersgatan 10, Göteborg. Öppet mån–lör 09–18." />
    <meta name="twitter:image" content="%VITE_SITE_URL%/images-mqlfpa5y.png" />

    <!-- Structured data: HairSalon (LocalBusiness) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "HairSalon",
        "@id": "%VITE_SITE_URL%/#business",
        "name": "KNC Studio",
        "url": "%VITE_SITE_URL%/",
        "image": "%VITE_SITE_URL%/images-mqlfpa5y.png",
        "telephone": "+46793043671",
        "priceRange": "200–450 kr",
        "currenciesAccepted": "SEK",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Geijersgatan 10",
          "postalCode": "411 34",
          "addressLocality": "Göteborg",
          "addressCountry": "SE"
        },
        "hasMap": "https://maps.apple.com/?q=Geijersgatan%2010,%20G%C3%B6teborg",
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"],
            "opens": "09:00",
            "closes": "18:00"
          }
        ],
        "availableLanguage": ["sv", "en"],
        "employee": [
          { "@type": "Person", "name": "Hassan" },
          { "@type": "Person", "name": "Victor" },
          { "@type": "Person", "name": "Salman" }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
