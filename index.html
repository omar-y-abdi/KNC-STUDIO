function bfBuildWeeks(year, month){
  const first = new Date(year, month, 1); const start = (first.getDay() + 6) % 7;
  const dim = new Date(year, month + 1, 0).getDate(); const cells = [];
  for (let i = 0; i < start; i++) cells.push(null);
  for (let d = 1; d <= dim; d++) cells.push(new Date(year, month, d));
  while (cells.length % 7) cells.push(null);
  const weeks = []; for (let i = 0; i < cells.length; i += 7) weeks.push(cells.slice(i, i + 7));
  return weeks;
}

    ${S.booked ? html`

/* ============================================================ *
 *  Site — KNC Studio.dc.html as ONE responsive website.        *
 *  Desktop (computer)  -> WEBB layout (editorial homepage).     *
 *  Mobile  (phone)     -> M3 layout (homepage <-> booking fold).*
 *  The .dc.html's browser-frame / phone-bezel / side-by-side    *
 *  showcase chrome is presentation, not the site — dropped.     *
 * ============================================================ */
const APP_T = {
  sv: { findUs:'Hitta oss', book:'Boka tid', kicker:'BARBERSHOP · GÖTEBORG',
    hours:'Öppet Mån–Lör 09–18 · Sön stängt', addr:'Geijersgatan 10, 411 34 Göteborg' },
  en: { findUs:'Find us', book:'Book appointment', kicker:'BARBERSHOP · GOTHENBURG',
    hours:'Open Mon–Sat 09–18 · Sun closed', addr:'Geijersgatan 10, 411 34 Gothenburg' },
};
const MOBILE_MQ = '(max-width: 768px)';
const PANEL_FULL = '100dvh';     // mobile homepage fills the real viewport (was a fixed 812px phone mock)
const PANEL_COMPACT = '112px';
const EASE = 'cubic-bezier(.32,.72,0,1)';

function App(){
  // Default to the device's light/dark preference (manual toggle still overrides afterwards).
  const [state, setRaw] = useState(() => ({
    mode: window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light',
    lang:'sv', deskBooking:false, mobBooking:false }));
  const setState = (u) => setRaw(s => ({ ...s, ...(typeof u === 'function' ? u(s) : u) }));
  const [isMobile, setIsMobile] = useState(() => window.matchMedia(MOBILE_MQ).matches);
  useEffect(() => {
    const m = window.matchMedia(MOBILE_MQ); const h = (e) => setIsMobile(e.matches);
    m.addEventListener('change', h); return () => m.removeEventListener('change', h);
  }, []);

  const dark = state.mode === 'dark';
  const lang = state.lang;
  const tx = APP_T[lang];
  const mob = state.mobBooking;
  const c = dark ? {
    bg:'#1c1c1e', text:'#f5f5f7', line:'rgba(255,255,255,.1)', navBg:'#262629',
    footer:'#161618', accent:'#f5f5f7', accentText:'#1c1c1e', iconF:'invert(1)',
  } : {
    bg:'#ffffff', text:'#1c1c1e', line:'rgba(0,0,0,.08)', navBg:'#f1f0ec',
    footer:'#faf9f6', accent:'#1c1c1e', accentText:'#ffffff', iconF:'none',
  };
  const mobMuted = dark ? 'rgba(255,255,255,.55)' : 'rgba(0,0,0,.5)';
  const mobBtnBg = dark ? 'rgba(255,255,255,.10)' : 'rgba(0,0,0,.06)';

  // Two different surfaces meet the screen edges:
  //  - topBar (theme-color): the top header/notch area. CONSTANT per mode — never changes when
  //    booking opens, so the notch + top panel always read the same colour.
  //  - pageBg (html/body, shown behind the translucent bottom URL bar): follows the content BELOW
  //    the header — panel surface on the homepage, booking surface once booking opens.
  // Two INDEPENDENT controls (confirmed by device testing):
  //  - theme-color tints the TOP status bar → keep it the panel surface, constant, so the top
  //    header + notch never change colour.
  //  - the document/body background shows behind the BOTTOM URL bar → set it to the surface BELOW
  //    the header (panel on the homepage, booking surface once booking opens) so the bottom strip
  //    always matches the content directly above it.
  const topBar = isMobile ? (dark ? '#242427' : '#f4f3f0') : c.bg;
  const pageBg = isMobile ? (mob ? c.bg : (dark ? '#242427' : '#f4f3f0')) : c.bg;
  useEffect(() => {
    document.documentElement.style.background = pageBg;
    document.body.style.background = pageBg;
    let meta = document.querySelector('meta[name="theme-color"]');
    if (!meta) { meta = document.createElement('meta'); meta.setAttribute('name', 'theme-color'); document.head.appendChild(meta); }
    meta.setAttribute('content', topBar);
  }, [pageBg, topBar]);
  const langMini = (on) => ({ border:'none', cursor:'pointer', fontFamily:'inherit', fontSize:'11px', fontWeight:700, letterSpacing:'.3px', padding:'4px 9px', borderRadius:'999px', background: on?(dark?'#f5f5f7':'#1c1c1e'):'transparent', color: on?(dark?'#1c1c1e':'#fff'):(dark?'rgba(255,255,255,.55)':'rgba(0,0,0,.5)') });

  const lineColor = c.line;
  const mapsHref = 'https://maps.apple.com/?q=Geijersgatan%2010,%20G%C3%B6teborg';
  const setSv = ()=>setState({lang:'sv'}), setEn = ()=>setState({lang:'en'});
  const toggleMode = ()=>setState(s=>({mode: s.mode==='dark'?'light':'dark'}));
  const toggleDeskBooking = ()=>setState(s=>({deskBooking:!s.deskBooking}));
  const openMobBooking = ()=>setState({mobBooking:true});
  const closeMobBooking = ()=>setState({mobBooking:false});

  // --- shared chrome (nav controls) ---
  const chromeIcon = { width:'15px', height:'15px', filter:c.iconF, opacity:.7 };
  const findUsStyle = { display:'flex', alignItems:'center', gap:'6px', padding:'7px 14px', borderRadius:'999px',
    border:'.5px solid '+(dark?'rgba(255,255,255,.22)':'rgba(0,0,0,.16)'), color:c.text, textDecoration:'none', fontWeight:600, opacity:.92 };
  const themeTrackStyle = { position:'relative', width:'54px', height:'30px', borderRadius:'999px', border:'none', cursor:'pointer', padding:0, flex:'none', background: dark?'rgba(120,120,128,.42)':'rgba(120,120,128,.26)' };
  const themeKnobStyle = { position:'absolute', top:'3px', left: dark?'27px':'3px', width:'24px', height:'24px', borderRadius:'50%', background:'#fff', display:'flex', alignItems:'center', justifyContent:'center', boxShadow:'0 1px 2px rgba(0,0,0,.3)', transition:'left .32s '+EASE };
  const themeKnobIconStyle = { width:'14px', height:'14px', opacity:.92 };
  const themeTrackIconStyle = { position:'absolute', top:'8px', [dark?'left':'right']:'9px', width:'14px', height:'14px', opacity:.5, filter: dark?'invert(1)':'none' };
  const themeKnobIconSrc = dark ? 'assets/icons/moon.svg' : 'assets/icons/sun.max.svg';
  const themeTrackIconSrc = dark ? 'assets/icons/sun.max.svg' : 'assets/icons/moon.svg';
  const langWrapStyle = { display:'flex', background: dark?'rgba(255,255,255,.08)':'rgba(0,0,0,.06)', borderRadius:'999px', padding:'2px', flex:'none' };
  const svMiniStyle = langMini(lang==='sv'), enMiniStyle = langMini(lang==='en');

  const themeToggle = html`<button onClick=${toggleMode} style=${themeTrackStyle} title="Växla ljust/mörkt"><img src=${themeTrackIconSrc} alt="" style=${themeTrackIconStyle}/><span style=${themeKnobStyle}><img src=${themeKnobIconSrc} alt="" style=${themeKnobIconStyle}/></span></button>`;
  const langToggle = html`<div style=${langWrapStyle}><button onClick=${setSv} style=${svMiniStyle}>SV</button><button onClick=${setEn} style=${enMiniStyle}>EN</button></div>`;

  /* ===================== MOBILE (M3) ===================== */
  if (isMobile) {
    const phoneShift = mob ? '24px' : '0px';
    const foldingPanelStyle = { position:'relative', display:'flex', flexDirection:'column', overflow:'hidden',
      background:(dark?'#242427':'#f4f3f0'), color:c.text,
      borderRadius: mob ? '0 0 28px 28px' : '0',  // rounded bottom on the collapsed header; flush full-bleed on the homepage
      height: mob ? PANEL_COMPACT : PANEL_FULL, transition:'height .66s '+EASE,
      '--mob-text':c.text, '--mob-muted':mobMuted, '--mob-icon':c.iconF, '--mob-btn-bg':mobBtnBg, '--mob-border':c.line };
    // KNC STUDIO is two elements that cross-fade (instead of one absolute element that slides):
    //  - heroKnc: in the centered hero flow on the homepage (can never collide with the kicker).
    //  - headerKnc: small, top-left, fades in when booking. Robust across every phone height.
    const heroKncStyle = { margin:'0 0 16px', fontFamily:"'SF Pro Display'", fontWeight:700, fontSize:'22px',
      letterSpacing:'2.5px', color:'var(--mob-text)', textAlign:'center' };
    const headerKncStyle = { position:'absolute', zIndex:6, margin:0, whiteSpace:'nowrap', fontFamily:"'SF Pro Display'", fontWeight:700,
      fontSize:'16px', letterSpacing:'2px', color:'var(--mob-text)', top:'calc(env(safe-area-inset-top, 0px) + 34px)', left:'22px',
      opacity: mob?1:0, pointerEvents:'none', transition:'opacity .4s ease' };
    const panelTopStyle = { flex:'none', padding:'0 22px 16px' };
    const expandChevStyle = { display: mob?'flex':'none', alignItems:'center', justifyContent:'center', width:'32px', height:'32px',
      padding:0, borderRadius:'50%', border:'none', cursor:'pointer', background:mobBtnBg };
    // pointer-events off while booking so the faded hero (and its bottom info row) never steals taps
    // from the compact-header controls behind it.
    const heroExtrasStyle = { flex:1, minHeight:0, overflow:'hidden', display:'flex', flexDirection:'column', alignItems:'stretch',
      justifyContent:'center', textAlign:'center', padding:'0 26px', opacity: mob?0:1, pointerEvents: mob?'none':'auto', transition:'opacity .34s ease' };
    const heroBtnDarkStyle = { alignSelf:'stretch', border:'none', cursor:'pointer', fontFamily:'inherit', background:c.accent, color:c.accentText,
      fontWeight:600, fontSize:'16px', padding:'15px', borderRadius:'13px' };
    const infoBlockStyle = { position:'absolute', left:'26px', right:'26px', bottom:'calc(env(safe-area-inset-bottom, 0px) + 22px)',
      display:'flex', alignItems:'flex-end', justifyContent:'space-between', gap:'12px' };
    const m3BodyStyle = { background:c.bg, color:c.text, minHeight:'calc(100dvh - '+PANEL_COMPACT+')' };

    return html`
    <div style=${{ position:'relative', height:'100dvh', overflowY: mob?'auto':'hidden', overflowX:'hidden',
        background:c.bg, color:c.text, fontFamily:"'SF Pro Text',-apple-system,system-ui,sans-serif", WebkitFontSmoothing:'antialiased' }}>

      <div style=${foldingPanelStyle}>
        <div style=${panelTopStyle}>
          <div style=${{ height:'calc(env(safe-area-inset-top, 0px) + 30px)' }}></div>
          <div style=${{ display:'flex', alignItems:'center', justifyContent:'space-between', gap:'10px', marginTop:phoneShift, transition:'margin-top .6s '+EASE }}>
            <a href="tel:0793043671" style=${{ display:'flex', alignItems:'center', gap:'8px', textDecoration:'none', color:'var(--mob-text)', fontSize:'12px' }}><img src="assets/icons/phone.svg" alt="Ring" style=${{ background:'var(--mob-btn-bg)', width:'28px', height:'28px', padding:'7px', boxSizing:'border-box', borderRadius:'50%', filter:'var(--mob-icon)' }}/>079‑304 36 71</a>
            <div style="display:flex;align-items:center;gap:6px;flex:none;">
              ${langToggle}
              ${themeToggle}
              <button onClick=${closeMobBooking} style=${expandChevStyle} title="Till startsidan"><img src="assets/icons/chevron.down.svg" alt="Till startsidan" style=${{ width:'13px', height:'13px', filter:'var(--mob-icon)' }}/></button>
            </div>
          </div>
        </div>

        <div style=${headerKncStyle}>KNC STUDIO</div>

        <div style=${heroExtrasStyle}>
          <div style=${heroKncStyle}>KNC STUDIO</div>
          <div style=${{ fontSize:'11px', fontWeight:600, letterSpacing:'2.5px', color:'var(--mob-muted)', marginBottom:'10px', textAlign:'center' }}>${tx.kicker}</div>
          <h2 style=${{ fontFamily:"'SF Pro Display'", fontWeight:600, fontSize:'34px', letterSpacing:'2.5px', lineHeight:1.08, margin:'0 0 10px', textAlign:'center' }}>hmu</h2>
          <p style=${{ fontSize:'14px', lineHeight:1.55, color:'var(--mob-muted)', margin:'0 0 24px', textAlign:'center' }}>for a fresh fade</p>
          <button onClick=${openMobBooking} style=${heroBtnDarkStyle}>${tx.book}</button>
          <div style=${infoBlockStyle}>
            <div style=${{ display:'flex', flexDirection:'column', gap:'8px', textAlign:'left' }}>
              <span style=${{ display:'flex', alignItems:'center', gap:'6px', fontSize:'12px', color:'var(--mob-muted)' }}><img src="assets/icons/clock.svg" alt="" style=${{ width:'13px', height:'13px', filter:'var(--mob-icon)', opacity:.5 }}/>${tx.hours}</span>
              <span style=${{ display:'flex', alignItems:'center', gap:'5px', fontSize:'12px', color:'var(--mob-muted)' }}><img src="assets/icons/mappin.circle.fill.svg" alt="" style=${{ width:'13px', height:'13px', filter:'var(--mob-icon)', opacity:.6 }}/>${tx.addr}</span>
            </div>
            <a href=${mapsHref} target="_blank" rel="noopener" style=${{ display:'flex', alignItems:'center', gap:'6px', textDecoration:'none', color:'var(--mob-text)', fontWeight:600, fontSize:'13px', border:'1.8px solid var(--mob-border)', borderRadius:'999px', padding:'6px 12px', opacity:.92, whiteSpace:'nowrap', flex:'none' }}>${tx.findUs}<img src="assets/icons/mappin.circle.fill.svg" alt="" style=${chromeIcon}/></a>
          </div>
        </div>
      </div>

      <div style=${m3BodyStyle}>
        <${BookingFlow} mode=${state.mode} defaultLang=${lang} showHeader=${false}/>
      </div>

    </div>`;
  }

  /* ===================== DESKTOP (WEBB · Editorial) ===================== */
  const navStyle = { display:'flex', alignItems:'center', justifyContent:'space-between', padding:'15px 30px',
    background:c.navBg, borderBottom:'.5px solid '+c.line };
  const heroBtnStyle = state.deskBooking
    ? { display:'inline-flex', alignItems:'center', gap:'8px', cursor:'pointer', fontFamily:'inherit', background:'transparent', color:c.text,
        border:'1.5px solid '+c.text, fontWeight:600, fontSize:'15px', padding:'11.5px 26.5px', borderRadius:'11px' }
    : { display:'inline-flex', alignItems:'center', gap:'8px', border:'none', cursor:'pointer', fontFamily:'inherit', background:c.accent, color:c.accentText,
        fontWeight:600, fontSize:'15px', padding:'13px 28px', borderRadius:'11px' };
  const deskFoldStyle = { display:'grid', gridTemplateRows: state.deskBooking?'1fr':'0fr',
    opacity: state.deskBooking?1:0, transition:'grid-template-rows .58s '+EASE+', opacity .42s ease' };
  const deskFoldInnerStyle = { overflow:'hidden', minHeight:0 };
  const footerStyle = { display:'flex', alignItems:'center', justifyContent:'space-between', padding:'18px 40px', borderTop:'.5px solid '+c.line,
    background:c.footer, fontSize:'13px', opacity:.6, flex:'none', flexWrap:'wrap', gap:'8px' };

  return html`
  <div style=${{ minHeight:'100vh', display:'flex', flexDirection:'column', background:c.bg, color:c.text,
      fontFamily:"'SF Pro Text',-apple-system,system-ui,sans-serif", WebkitFontSmoothing:'antialiased' }}>

    <div style=${navStyle}>
      <span style="font-family: 'SF Pro Display'; font-weight: 700; letter-spacing: 2px; font-size: 20px">KNC STUDIO</span>
      <div style="display:flex;align-items:center;gap:14px;font-size:13px;">
        <a href=${mapsHref} target="_blank" rel="noopener" style=${findUsStyle}><img src="assets/icons/mappin.circle.fill.svg" alt="" style=${chromeIcon}/>${tx.findUs}</a>
        <a href="tel:0793043671" style="display:flex;align-items:center;gap:6px;opacity:.6;text-decoration:none;color:inherit;"><img src="assets/icons/phone.svg" alt="Ring" style=${chromeIcon}/>079‑304 36 71</a>
        ${langToggle}${themeToggle}
      </div>
    </div>

    <div style=${{ flex:1, display:'flex', flexDirection:'column', justifyContent:'center' }}>
      <div style="text-align: center; padding: 74px 40px 60px; color: inherit">
        <div style="font-size: 13px; font-weight: 600; letter-spacing: 1.5px; opacity: .45; margin-bottom: 16px; color: inherit">${tx.kicker}</div>
        <h2 style="font-family: 'SF Pro Display'; font-weight: 600; font-size: 54px; letter-spacing: -1.5px; line-height: 1.05; margin: 0 auto 16px; max-width: 640px; color: inherit">hmu</h2>
        <p style="font-size: 18px; line-height: 1.5; opacity: .5; max-width: 500px; margin: 0 auto 32px; color: inherit">for a fresh fade</p>
        <button onClick=${toggleDeskBooking} style=${heroBtnStyle} type="button">${tx.book}</button>
      </div>
      <div style=${deskFoldStyle}>
        <div style=${deskFoldInnerStyle}>
          <div style=${'border-top:.5px solid '+lineColor+';max-width:1180px;margin:0 auto;width:100%;box-sizing:border-box;'}><${BookingFlow} mode=${state.mode} defaultLang=${lang} showHeader=${false}/></div>
        </div>
      </div>
    </div>

    <div style=${footerStyle}>
      <span>${tx.hours}</span>
      <span>${tx.addr}</span>
    </div>
  </div>`;
}

render(html`<${App}/>`, document.getElementById('root'));
</script>
</body>
</html>
