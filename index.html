<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Present at load so iOS honours it; JS updates it to the panel surface per light/dark. -->
    <meta name="theme-color" content="#f4f3f0" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title id="business-title">Boka tid online</title>
    <meta
      id="business-description"
      name="description"
      content="Välj barberare, behandling och tid och boka online."
    />
    <link rel="canonical" href="%VITE_SITE_URL%/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/InterVariable-Latin.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/PlayfairDisplay-Latin-700.woff2"
      crossorigin
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta id="business-og-site-name" property="og:site_name" content="Onlinebokning" />
    <meta id="business-og-title" property="og:title" content="Boka tid online" />
    <meta
      id="business-og-description"
      property="og:description"
      content="Välj barberare, behandling och tid och boka online."
    />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta id="business-og-image-alt" property="og:image:alt" content="Onlinebokning" />
    <meta property="og:locale" content="sv_SE" />
    <meta property="og:locale:alternate" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta id="business-twitter-title" name="twitter:title" content="Boka tid online" />
    <meta
      id="business-twitter-description"
      name="twitter:description"
      content="Välj barberare, behandling och tid och boka online."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.png" />

    <!-- Structured data: HairSalon (LocalBusiness) -->
    <script id="business-json-ld" type="application/ld+json">
      {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
